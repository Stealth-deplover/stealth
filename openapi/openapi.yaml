      parameters: [{ $ref: '#/components/parameters/ProjectID' }, { $ref: '#/components/parameters/FunctionID' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses: { '200': { description: Deployments page, content: { application/json: { schema: { $ref: '#/components/schemas/FunctionDeploymentsPage' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    post:
      operationId: uploadFunctionDeployment
      description: Stream an opaque source archive into the private function artifact store. The control plane does not extract or execute it; the trusted worker asynchronously builds an immutable artifact and reports build_status.
      security: [{ sessionCookie: [] }, { projectApiKey: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectID' }, { $ref: '#/components/parameters/FunctionID' }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { $ref: '#/components/schemas/FunctionDeploymentUploadRequest' } } } }
      responses: { '201': { description: Deployment source stored and build queued; poll the deployment until build_status is succeeded before expecting execution, content: { application/json: { schema: { $ref: '#/components/schemas/FunctionDeploymentResponse' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '413': { $ref: '#/components/responses/PayloadTooLarge' }, '415': { $ref: '#/components/responses/UnsupportedMediaType' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /v1/projects/{projectID}/functions/{functionID}/deployments/{deploymentID}:
    get:
      operationId: getFunctionDeployment
      security: [{ sessionCookie: [] }, { projectApiKey: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectID' }, { $ref: '#/components/parameters/FunctionID' }, { $ref: '#/components/parameters/DeploymentID' }]
      responses: { '200': { description: Deployment metadata, content: { application/json: { schema: { $ref: '#/components/schemas/FunctionDeploymentResponse' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      operationId: deleteFunctionDeployment
      description: Delete an inactive deployment and its source artifact.
      security: [{ sessionCookie: [] }, { projectApiKey: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectID' }, { $ref: '#/components/parameters/FunctionID' }, { $ref: '#/components/parameters/DeploymentID' }]
      responses: { '204': { description: Deployment deleted }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/projects/{projectID}/functions/{functionID}/deployments/{deploymentID}/activate:
    post:
      operationId: activateFunctionDeployment
      description: Atomically make one ready deployment active and supersede the previous active deployment.
      security: [{ sessionCookie: [] }, { projectApiKey: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectID' }, { $ref: '#/components/parameters/FunctionID' }, { $ref: '#/components/parameters/DeploymentID' }]
      responses: { '200': { description: Activated deployment and updated function, content: { application/json: { schema: { $ref: '#/components/schemas/ActivateFunctionDeploymentResponse' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/projects/{projectID}/functions/{functionID}/deployments/{deploymentID}/logs:
    get:
      operationId: listFunctionBuildLogs
      description: Read bounded, secret-redacted build logs emitted by the trusted Function build worker. API-key callers require functions.read.
      security: [{ sessionCookie: [] }, { projectApiKey: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectID' }, { $ref: '#/components/parameters/FunctionID' }, { $ref: '#/components/parameters/DeploymentID' }, { $ref: '#/components/parameters/Limit' }, { name: after, in: query, schema: { type: integer, format: int64, minimum: 0, default: 0 } }]
      responses: { '200': { description: Redacted build logs, content: { application/json: { schema: { $ref: '#/components/schemas/FunctionBuildLogsPage' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /v1/projects/{projectID}/functions/{functionID}/executions:
    post:
      operationId: createFunctionExecution
      description: Enqueue an execution against the active deployment. Console/API-key callers require functions.write; source code runs asynchronously in the isolated worker and waits behind a queued deployment build when necessary.
      security: [{ sessionCookie: [] }, { projectApiKey: [] }, { projectAppCookie: [] }, {}]
      parameters: [{ $ref: '#/components/parameters/ProjectID' }, { $ref: '#/components/parameters/FunctionID' }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/CreateFunctionExecutionRequest' } } } }
      responses: { '202': { description: Execution accepted, content: { application/json: { schema: { $ref: '#/components/schemas/FunctionExecutionResponse' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '413': { $ref: '#/components/responses/PayloadTooLarge' }, '415': { $ref: '#/components/responses/UnsupportedMediaType' }, '422': { $ref: '#/components/responses/ValidationError' } }
    get:
      operationId: listFunctionExecutions
      description: List execution metadata produced by the trusted runtime worker.
      security: [{ sessionCookie: [] }, { projectApiKey: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectID' }, { $ref: '#/components/parameters/FunctionID' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses: { '200': { description: Executions page, content: { application/json: { schema: { $ref: '#/components/schemas/FunctionExecutionsPage' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /v1/projects/{projectID}/functions/{functionID}/executions/{executionID}:
    get:
      operationId: getFunctionExecution
      security: [{ sessionCookie: [] }, { projectApiKey: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectID' }, { $ref: '#/components/parameters/FunctionID' }, { $ref: '#/components/parameters/ExecutionID' }]
      responses: { '200': { description: Execution metadata, content: { application/json: { schema: { $ref: '#/components/schemas/FunctionExecutionResponse' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /v1/projects/{projectID}/functions/{functionID}/executions/{executionID}/logs:
    get:
      operationId: listFunctionExecutionLogs
      description: Read bounded, secret-redacted runtime logs for an execution. API-key callers require functions.read.
      security: [{ sessionCookie: [] }, { projectApiKey: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectID' }, { $ref: '#/components/parameters/FunctionID' }, { $ref: '#/components/parameters/ExecutionID' }, { $ref: '#/components/parameters/Limit' }, { name: after, in: query, schema: { type: integer, format: int64, minimum: 0, default: 0 } }]
      responses: { '200': { description: Redacted execution logs, content: { application/json: { schema: { $ref: '#/components/schemas/FunctionExecutionLogsPage' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: stealth_session }
    projectAppCookie: { type: apiKey, in: cookie, name: stealth_app_<project-id-without-hyphens>, description: Project-specific opaque HttpOnly cookie. The actual name is derived from the path projectID; it is never the Console stealth_session cookie. }
    projectApiKey: { type: apiKey, in: header, name: X-Stealth-Key, description: Project-bound server-to-server secret. Supported scopes include users, databases, storage, functions, sites, webhooks, realtime.read, and messaging read/write pairs; never send this header through the Console browser bridge. }
  parameters:
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Cursor: { name: cursor, in: query, schema: { type: string, format: uuid } }
    OrganizationID: { name: organizationID, in: path, required: true, schema: { type: string, format: uuid } }
    IncidentID: { name: incidentID, in: path, required: true, schema: { type: string, format: uuid } }
    SessionID: { name: sessionID, in: path, required: true, schema: { type: string, format: uuid } }
    ProjectID: { name: projectID, in: path, required: true, schema: { type: string, format: uuid } }
    AgentID: { name: agentID, in: path, required: true, schema: { type: string, format: uuid } }
    RunID: { name: runID, in: path, required: true, schema: { type: string, format: uuid } }
    UserID: { name: userID, in: path, required: true, schema: { type: string, format: uuid } }
    KeyID: { name: keyID, in: path, required: true, schema: { type: string, format: uuid } }
    DatabaseID: { name: databaseID, in: path, required: true, schema: { type: string, format: uuid } }
    BucketID: { name: bucketID, in: path, required: true, schema: { type: string, format: uuid } }
    FileID: { name: fileID, in: path, required: true, schema: { type: string, format: uuid } }
    TableID: { name: tableID, in: path, required: true, schema: { type: string, format: uuid } }
    ColumnID: { name: columnID, in: path, required: true, schema: { type: string, format: uuid } }
    IndexID: { name: indexID, in: path, required: true, schema: { type: string, format: uuid } }
    RelationshipID: { name: relationshipID, in: path, required: true, schema: { type: string, format: uuid } }
    BackupID: { name: backupID, in: path, required: true, schema: { type: string, format: uuid } }
    RowID: { name: rowID, in: path, required: true, schema: { type: string, format: uuid } }
    FunctionID: { name: functionID, in: path, required: true, schema: { type: string, format: uuid } }
    SiteID: { name: siteID, in: path, required: true, schema: { type: string, format: uuid } }
    WebhookID: { name: webhookID, in: path, required: true, schema: { type: string, format: uuid } }
    ProviderID: { name: providerID, in: path, required: true, schema: { type: string, format: uuid } }
    TopicID: { name: topicID, in: path, required: true, schema: { type: string, format: uuid } }
    SubscriberID: { name: subscriberID, in: path, required: true, schema: { type: string, format: uuid } }
    MessageID: { name: messageID, in: path, required: true, schema: { type: string, format: uuid } }
    DomainID: { name: domainID, in: path, required: true, schema: { type: string, format: uuid } }
    VariableID: { name: variableID, in: path, required: true, schema: { type: string, format: uuid } }
    DeploymentID: { name: deploymentID, in: path, required: true, schema: { type: string, format: uuid } }
    ExecutionID: { name: executionID, in: path, required: true, schema: { type: string, format: uuid } }
    RowCursor: { name: cursor, in: query, description: Opaque cursor returned by a previous row page; use it unchanged, schema: { type: string, minLength: 1, maxLength: 512 } }
    FilterJSON: { name: filter, in: query, description: 'JSON object of equality filters, for example {"status":"active"}. Each filtered column must have a real key index.', schema: { type: string, maxLength: 4096 } }
    OrderBy: { name: order_by, in: query, description: Declared required column key or id. Non-system columns must have a real key index., schema: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]{0,119}$' } }
    OrderDirection: { name: order_direction, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
    Search: { name: search, in: query, description: Full-text search phrase. Requires search_column and a fulltext index on that varchar/text column., schema: { type: string, maxLength: 256 } }
    SearchColumn: { name: search_column, in: query, description: Declared varchar/text column whose fulltext index should evaluate search., schema: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]{0,119}$' } }
  responses:
    BadRequest: { description: Invalid JSON or parameter, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    Unauthorized: { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    InvalidCredentials: { description: Invalid credentials, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    Forbidden: { description: Insufficient organization role, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    Conflict: { description: Resource conflict, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    NotFound: { description: Resource not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    NotReady: { description: Dependency unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    InternalError: { description: Internal server error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    RateLimited: { description: Public Auth rate limit exceeded, headers: { Retry-After: { description: Seconds until another attempt may be made, schema: { type: integer, minimum: 1 } } }, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    ServiceUnavailable: { description: Public Auth protection or a required dependency is unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    PayloadTooLarge: { description: Request body exceeds the endpoint's configured limit (JSON requests are bounded separately from multipart uploads), content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    UnsupportedMediaType: { description: Content-Type must be application/json except for file upload multipart/form-data endpoints, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    ValidationError: { description: Validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  schemas:
    Status: { type: object, required: [status], properties: { status: { type: string, enum: [ok, ready] } } }
    RegisterRequest: { type: object, additionalProperties: false, required: [email, password], properties: { email: { type: string, format: email }, password: { type: string, minLength: 12, maxLength: 256, writeOnly: true }, organization_name: { type: string, minLength: 2, maxLength: 120 } } }
    LoginRequest: { type: object, additionalProperties: false, required: [email, password], properties: { email: { type: string, format: email }, password: { type: string, writeOnly: true } } }
    AuthVerificationRequest: { type: object, additionalProperties: false, description: Empty JSON object by default; an optional trusted url may receive the tokenized link., properties: { url: { type: string, format: uri, maxLength: 2048 } } }
    AuthTokenRequest: { type: object, additionalProperties: false, anyOf: [{ required: [token] }, { required: [secret] }], properties: { token: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$', writeOnly: true }, secret: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$', writeOnly: true }, user_id: { type: string, format: uuid, description: Compatibility field; the opaque token is authoritative. } } }
    PasswordRecoveryRequest: { type: object, additionalProperties: false, required: [email], properties: { email: { type: string, format: email, maxLength: 320 }, url: { type: string, format: uri, maxLength: 2048 } } }
    PasswordResetRequest: { type: object, additionalProperties: false, required: [password], anyOf: [{ required: [token] }, { required: [secret] }], properties: { token: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$', writeOnly: true }, secret: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$', writeOnly: true }, user_id: { type: string, format: uuid, description: Compatibility field; the opaque token is authoritative. }, password: { type: string, minLength: 12, maxLength: 256, writeOnly: true } } }
    CreateOrganizationRequest: { type: object, additionalProperties: false, required: [name, slug], properties: { name: { type: string, minLength: 2, maxLength: 120 }, slug: { $ref: '#/components/schemas/Slug' } } }
    UpdateOrganizationRequest: { type: object, additionalProperties: false, required: [name, slug], properties: { name: { type: string, minLength: 2, maxLength: 120 }, slug: { $ref: '#/components/schemas/Slug' } } }
    CreateProjectRequest: { type: object, additionalProperties: false, required: [name], properties: { name: { $ref: '#/components/schemas/Slug' } } }
    UpdateProjectRequest: { type: object, additionalProperties: false, required: [name], properties: { name: { $ref: '#/components/schemas/Slug' } } }
    DeleteProjectRequest: { type: object, additionalProperties: false, required: [confirm_name], properties: { confirm_name: { $ref: '#/components/schemas/Slug', description: Must exactly match the current project name. } } }
    CreateOrganizationMembershipRequest: { type: object, additionalProperties: false, required: [email, role], properties: { email: { type: string, format: email, maxLength: 320 }, role: { type: string, enum: [admin, developer, viewer, billing] } } }
    UpdateOrganizationMembershipRequest: { type: object, additionalProperties: false, required: [role], properties: { role: { type: string, enum: [admin, developer, viewer, billing] } } }
    CreateOrganizationInvitationRequest: { type: object, additionalProperties: false, required: [email, role], properties: { email: { type: string, format: email, maxLength: 320 }, role: { type: string, enum: [admin, developer, viewer, billing] } } }
    AcceptOrganizationInvitationRequest: { type: object, additionalProperties: false, anyOf: [{ required: [token] }, { required: [secret] }], properties: { token: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$', writeOnly: true }, secret: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$', writeOnly: true } } }
    CreateProjectUserRequest: { type: object, additionalProperties: false, required: [email, password], properties: { email: { type: string, format: email, maxLength: 320 }, password: { type: string, minLength: 12, maxLength: 256, writeOnly: true }, name: { type: [string, 'null'], minLength: 2, maxLength: 120 } } }
    UpdateProjectUserStatusRequest: { type: object, additionalProperties: false, required: [status], properties: { status: { type: string, enum: [active, blocked] } } }
    CreateProjectAPIKeyRequest: { type: object, additionalProperties: false, required: [name, scopes], properties: { name: { type: string, minLength: 2, maxLength: 120 }, scopes: { type: array, minItems: 1, maxItems: 15, uniqueItems: true, items: { type: string, enum: [users.read, users.write, databases.read, databases.write, storage.read, storage.write, functions.read, functions.write, sites.read, sites.write, webhooks.read, webhooks.write, realtime.read, messaging.read, messaging.write] } }, expires_at: { type: [string, 'null'], format: date-time, description: Optional future expiry, at most 365 days from creation. } } }
    UpdateProjectAuthSettingsRequest: { type: object, additionalProperties: false, minProperties: 1, properties: { registration_enabled: { type: boolean }, cors_origins: { type: array, maxItems: 32, uniqueItems: true, items: { type: string, minLength: 8, maxLength: 2048, pattern: '^(http|https)://[^*/\\s/?#]+(:[0-9]+)?$' } } } }
    Slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$' }
    Account: { type: object, required: [id, email, email_verified, created_at], properties: { id: { type: string, format: uuid }, email: { type: string, format: email }, email_verified: { type: boolean }, created_at: { type: string, format: date-time } } }
    ConsoleSession: { type: object, additionalProperties: false, required: [id, is_current, expires_at, created_at], properties: { id: { type: string, format: uuid }, is_current: { type: boolean }, expires_at: { type: string, format: date-time }, created_at: { type: string, format: date-time } } }
    UpdateAccountPasswordRequest: { type: object, additionalProperties: false, required: [current_password, password], properties: { current_password: { type: string, minLength: 1, maxLength: 256, writeOnly: true }, password: { type: string, minLength: 12, maxLength: 256, writeOnly: true } } }
    Organization: { type: object, required: [id, name, slug, created_at], properties: { id: { type: string, format: uuid }, name: { type: string }, slug: { $ref: '#/components/schemas/Slug' }, created_at: { type: string, format: date-time } } }
    OrganizationPlanLimits: { type: object, additionalProperties: false, required: [projects, members, databases, storage_buckets, functions, sites], properties: { projects: { type: integer, format: int64, minimum: -1 }, members: { type: integer, format: int64, minimum: -1 }, databases: { type: integer, format: int64, minimum: -1 }, storage_buckets: { type: integer, format: int64, minimum: -1 }, functions: { type: integer, format: int64, minimum: -1 }, sites: { type: integer, format: int64, minimum: -1 } }, description: A value of -1 means unlimited. }
    OrganizationPlanUsage: { type: object, additionalProperties: false, required: [projects, members, databases, storage_buckets, functions, sites], properties: { projects: { type: integer, format: int64, minimum: 0 }, members: { type: integer, format: int64, minimum: 0 }, databases: { type: integer, format: int64, minimum: 0 }, storage_buckets: { type: integer, format: int64, minimum: 0 }, functions: { type: integer, format: int64, minimum: 0 }, sites: { type: integer, format: int64, minimum: 0 } } }
    OrganizationPlan: { type: object, additionalProperties: false, required: [organization_id, plan_key, status, current_period_start, current_period_end, limits, usage], properties: { organization_id: { type: string, format: uuid }, plan_key: { type: string, enum: [free, pro, enterprise] }, status: { type: string, enum: [active, past_due, canceled] }, current_period_start: { type: string, format: date }, current_period_end: { type: string, format: date }, limits: { $ref: '#/components/schemas/OrganizationPlanLimits' }, usage: { $ref: '#/components/schemas/OrganizationPlanUsage' } } }
    Membership: { type: object, required: [organization_id, account_id, email, role, created_at], properties: { organization_id: { type: string, format: uuid }, account_id: { type: string, format: uuid }, email: { type: string, format: email }, role: { type: string, enum: [owner, admin, developer, viewer, billing] }, created_at: { type: string, format: date-time } } }
    AuditEvent: { type: object, additionalProperties: false, required: [id, organization_id, action, target_type, metadata, created_at], properties: { id: { type: string, format: uuid }, organization_id: { type: string, format: uuid }, actor_account_id: { type: [string, 'null'], format: uuid }, actor_email: { type: [string, 'null'], format: email }, action: { type: string, minLength: 3, maxLength: 120 }, target_type: { type: string, minLength: 3, maxLength: 80 }, target_id: { type: [string, 'null'], format: uuid }, metadata: { type: object, additionalProperties: true }, created_at: { type: string, format: date-time } } }
    Project: { type: object, required: [id, organization_id, name, created_at], properties: { id: { type: string, format: uuid }, organization_id: { type: string, format: uuid }, name: { $ref: '#/components/schemas/Slug' }, created_at: { type: string, format: date-time } } }
    ProjectServiceLayout: { type: object, additionalProperties: false, required: [project_id, resource_type, resource_id, x, y, updated_at], properties: { project_id: { type: string, format: uuid }, resource_type: { type: string, enum: [function, site, database, storage] }, resource_id: { type: string, format: uuid }, x: { type: integer, minimum: -100000, maximum: 100000 }, y: { type: integer, minimum: -100000, maximum: 100000 }, updated_at: { type: string, format: date-time } } }
    ProjectServiceLayoutItemRequest: { type: object, additionalProperties: false, required: [resource_type, resource_id, x, y], properties: { resource_type: { type: string, enum: [function, site, database, storage] }, resource_id: { type: string, format: uuid }, x: { type: integer, minimum: -100000, maximum: 100000 }, y: { type: integer, minimum: -100000, maximum: 100000 } } }
    ReplaceProjectServiceLayoutRequest: { type: object, additionalProperties: false, required: [layout], properties: { layout: { type: array, maxItems: 500, uniqueItems: true, items: { $ref: '#/components/schemas/ProjectServiceLayoutItemRequest' } } } }
