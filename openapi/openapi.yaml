openapi: 3.1.0
info:
  title: Stealth Console API
  version: 0.1.0
  description: Control-plane API for Stealth Console. Browser sessions are opaque HttpOnly cookies and are never returned in JSON.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: health
      responses:
        '200': { description: Process is running, content: { application/json: { schema: { $ref: '#/components/schemas/Status' } } } }
  /readyz:
    get:
      operationId: readiness
      responses:
        '200': { description: Dependencies are ready, content: { application/json: { schema: { $ref: '#/components/schemas/Status' } } } }
        '503': { $ref: '#/components/responses/NotReady' }
  /v1/account/registrations:
    post:
      operationId: registerAccount
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } } }
      responses:
        '201': { description: Account, personal organization, and HttpOnly session cookie created, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/account/verification:
    post:
      operationId: sendAccountVerification
      description: Send a one-time verification link to the authenticated Console account. A previous unused link is invalidated.
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AuthVerificationRequest' } } } }
      responses:
        '204': { description: Verification message accepted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      operationId: confirmAccountVerification
      description: Consume a one-time Console email verification token.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AuthTokenRequest' } } } }
      responses:
        '200': { description: Verified account, content: { application/json: { schema: { $ref: '#/components/schemas/AccountResponse' } } } }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/account/recovery:
    post:
      operationId: createAccountRecovery
      description: Request a password reset email. The accepted response is identical whether the address exists.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordRecoveryRequest' } } } }
      responses:
        '202': { description: Recovery request accepted, content: { application/json: { schema: { $ref: '#/components/schemas/AcceptedResponse' } } } }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: confirmAccountRecovery
      description: Replace the Console password with a valid one-time recovery token and revoke all existing sessions.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetRequest' } } } }
      responses:
        '204': { description: Password updated and sessions revoked }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/account:
    get:
      operationId: getCurrentAccount
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: Current account, content: { application/json: { schema: { $ref: '#/components/schemas/AccountResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /v1/account/sessions:
    get:
      operationId: listAccountSessions
      description: List active Console sessions for the authenticated account. Session bearer tokens and hashes are never returned.
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: Active Console sessions, content: { application/json: { schema: { $ref: '#/components/schemas/AccountSessionsResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '500': { $ref: '#/components/responses/InternalError' } }
    delete:
      operationId: revokeOtherAccountSessions
      description: Revoke every Console session except the current session and return the number revoked.
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: Sessions revoked, content: { application/json: { schema: { $ref: '#/components/schemas/RevokedSessionsResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '500': { $ref: '#/components/responses/InternalError' } }
  /v1/account/sessions/{sessionID}:
    delete:
      operationId: revokeAccountSession
      description: Revoke one Console session owned by the authenticated account. Revoking the current session also clears its cookie.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionID' }]
      responses: { '204': { description: Session revoked }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' }, '500': { $ref: '#/components/responses/InternalError' } }
  /v1/account/password:
    patch:
      operationId: updateAccountPassword
      description: Replace the authenticated Console account password after verifying the current password. All other Console sessions are revoked; the current session remains valid.
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateAccountPasswordRequest' } } } }
      responses: { '200': { description: Password updated, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordUpdateResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '413': { $ref: '#/components/responses/PayloadTooLarge' }, '415': { $ref: '#/components/responses/UnsupportedMediaType' }, '422': { $ref: '#/components/responses/ValidationError' }, '500': { $ref: '#/components/responses/InternalError' } }
  /v1/sessions/email-password:
    post:
      operationId: createEmailPasswordSession
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses:
        '204': { description: Session cookie created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
  /v1/session:
    delete:
      operationId: deleteCurrentSession
      security: [{ sessionCookie: [] }]
      responses: { '204': { description: Session revoked and cookie cleared }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /v1/organizations:
    get:
      operationId: listOrganizations
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses: { '200': { description: Organizations visible to the current account, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationsPage' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }
    post:
      operationId: createOrganization
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateOrganizationRequest' } } } }
      responses: { '201': { description: Organization created; caller is owner, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationResponse' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { $ref: '#/components/responses/Conflict' }, '413': { $ref: '#/components/responses/PayloadTooLarge' }, '415': { $ref: '#/components/responses/UnsupportedMediaType' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /v1/organizations/{organizationID}:
    patch:
      operationId: updateOrganization
      description: Update an organization's display name and unique slug. Owners and admins may edit identity metadata; the organization ID is immutable.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateOrganizationRequest' } } } }
      responses: { '200': { description: Updated organization, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationResponse' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '413': { $ref: '#/components/responses/PayloadTooLarge' }, '415': { $ref: '#/components/responses/UnsupportedMediaType' }, '422': { $ref: '#/components/responses/ValidationError' }, '500': { $ref: '#/components/responses/InternalError' } }
  /v1/organizations/{organizationID}/plan:
    get:
      operationId: getOrganizationPlan
      description: Return the effective organization plan, current period, server-owned resource limits, and bounded resource counts. Payment-provider identifiers are never returned.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
      responses: { '200': { description: Organization plan and usage, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationPlanResponse' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '500': { $ref: '#/components/responses/InternalError' } }
  /v1/organizations/{organizationID}/memberships:
    get:
      operationId: listOrganizationMemberships
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationID' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses: { '200': { description: Organization memberships and caller capabilities, content: { application/json: { schema: { $ref: '#/components/schemas/MembershipsPage' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      operationId: createOrganizationMembership
      description: Add an existing Console account to an organization. The account must already exist; this endpoint does not create identities or send invitations.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateOrganizationMembershipRequest' } } } }
      responses: { '201': { description: Organization membership created, content: { application/json: { schema: { $ref: '#/components/schemas/MembershipResponse' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '413': { $ref: '#/components/responses/PayloadTooLarge' }, '415': { $ref: '#/components/responses/UnsupportedMediaType' }, '422': { $ref: '#/components/responses/ValidationError' }, '500': { $ref: '#/components/responses/InternalError' } }
  /v1/organizations/{organizationID}/memberships/{accountID}:
    patch:
      operationId: updateOrganizationMembership
      description: Change a non-owner organization membership role. Owners may manage all non-owner roles; admins may manage regular members but cannot grant or revoke admin.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationID' }, { name: accountID, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateOrganizationMembershipRequest' } } } }
      responses: { '200': { description: Updated organization membership, content: { application/json: { schema: { $ref: '#/components/schemas/MembershipResponse' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '413': { $ref: '#/components/responses/PayloadTooLarge' }, '415': { $ref: '#/components/responses/UnsupportedMediaType' }, '422': { $ref: '#/components/responses/ValidationError' }, '500': { $ref: '#/components/responses/InternalError' } }
    delete:
      operationId: deleteOrganizationMembership
      description: Remove a non-owner organization membership. The owner membership is protected until an ownership-transfer workflow exists.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationID' }, { name: accountID, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Membership removed }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '500': { $ref: '#/components/responses/InternalError' } }
  /v1/organizations/{organizationID}/invitations:
    get:
      operationId: listOrganizationInvitations
      description: List pending organization invitations. Owners and admins may read invitations; expired invitations remain visible until revoked or replaced.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationID' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses: { '200': { description: Organization invitations and caller capabilities, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationInvitationsPage' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '500': { $ref: '#/components/responses/InternalError' } }
    post:
      operationId: createOrganizationInvitation
      description: Create an email-bound, one-time invitation. The plaintext token is delivered only through the configured mailer and is never returned by the API.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateOrganizationInvitationRequest' } } } }
      responses: { '201': { description: Invitation persisted; delivery is reported as sent or failed, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationInvitationResponse' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '413': { $ref: '#/components/responses/PayloadTooLarge' }, '415': { $ref: '#/components/responses/UnsupportedMediaType' }, '422': { $ref: '#/components/responses/ValidationError' }, '500': { $ref: '#/components/responses/InternalError' } }
  /v1/organizations/{organizationID}/invitations/{invitationID}:
    delete:
      operationId: revokeOrganizationInvitation
      description: Revoke an unaccepted organization invitation. Repeating a revoke is idempotent; accepted invitations are immutable.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationID' }, { name: invitationID, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Invitation revoked, or already revoked }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '500': { $ref: '#/components/responses/InternalError' } }
  /v1/organizations/{organizationID}/incidents:
    get:
      operationId: listOrganizationIncidents
      description: List durable operational incidents visible to organization members. Owners and admins may create or update incidents.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationID' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses: { '200': { description: Organization incidents and caller capabilities, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationIncidentsPage' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '500': { $ref: '#/components/responses/InternalError' } }
    post:
      operationId: createOrganizationIncident
      description: Create a durable investigating incident and its initial timeline update. Only organization owners and admins may create incidents.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateOrganizationIncidentRequest' } } } }
      responses: { '201': { description: Incident created, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationIncidentResponse' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '413': { $ref: '#/components/responses/PayloadTooLarge' }, '415': { $ref: '#/components/responses/UnsupportedMediaType' }, '422': { $ref: '#/components/responses/ValidationError' }, '500': { $ref: '#/components/responses/InternalError' } }
  /v1/organizations/{organizationID}/incidents/{incidentID}:
    get:
      operationId: getOrganizationIncident
      description: Get one durable organization incident and its timeline.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationID' }, { $ref: '#/components/parameters/IncidentID' }]
      responses: { '200': { description: Organization incident and caller capabilities, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationIncidentDetailResponse' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '500': { $ref: '#/components/responses/InternalError' } }
    patch:
      operationId: updateOrganizationIncident
      description: Update incident metadata or status. Owners and admins may update incidents; every update is appended to the timeline and audit log.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationID' }, { $ref: '#/components/parameters/IncidentID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateOrganizationIncidentRequest' } } } }
      responses: { '200': { description: Updated organization incident, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationIncidentResponse' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '413': { $ref: '#/components/responses/PayloadTooLarge' }, '415': { $ref: '#/components/responses/UnsupportedMediaType' }, '422': { $ref: '#/components/responses/ValidationError' }, '500': { $ref: '#/components/responses/InternalError' } }
  /v1/organizations/{organizationID}/traces:
    get:
      operationId: listOrganizationTraces
      description: List the bounded durable root-request trace index visible to organization members. Nested spans and full OpenTelemetry attributes remain in the private telemetry backend.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationID' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses: { '200': { description: Durable organization request traces, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationTracesPage' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/ValidationError' }, '500': { $ref: '#/components/responses/InternalError' } }
  /v1/organization-invitations/accept:
    post:
      operationId: acceptOrganizationInvitation
      description: Consume an email-bound invitation for the signed-in Console account whose email matches the invitation.
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AcceptOrganizationInvitationRequest' } } } }
      responses: { '200': { description: Invitation accepted and membership created, content: { application/json: { schema: { $ref: '#/components/schemas/MembershipResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { description: Signed-in account email does not match the invitation, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }, '413': { $ref: '#/components/responses/PayloadTooLarge' }, '415': { $ref: '#/components/responses/UnsupportedMediaType' }, '422': { description: Token is malformed, expired, revoked, or already used, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }, '500': { $ref: '#/components/responses/InternalError' } }
  /v1/organizations/{organizationID}/audit-events:
    get:
      operationId: listOrganizationAuditEvents
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationID' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses: { '200': { description: Durable organization audit events, content: { application/json: { schema: { $ref: '#/components/schemas/AuditEventsPage' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /v1/organizations/{organizationID}/projects:
    get:
      operationId: listProjects
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationID' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses: { '200': { description: Projects scoped to an organization, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectsPage' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      operationId: createProject
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateProjectRequest' } } } }
      responses: { '201': { description: Project created, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectResponse' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '413': { $ref: '#/components/responses/PayloadTooLarge' }, '415': { $ref: '#/components/responses/UnsupportedMediaType' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /v1/projects/{projectID}:
    get:
      operationId: getProject
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectID' }]
      responses: { '200': { description: Project, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectResponse' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      operationId: updateProject
      description: Update mutable project metadata. Only project owners and admins may change the project name.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateProjectRequest' } } } }
      responses: { '200': { description: Updated project, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectResponse' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '413': { $ref: '#/components/responses/PayloadTooLarge' }, '415': { $ref: '#/components/responses/UnsupportedMediaType' }, '422': { $ref: '#/components/responses/ValidationError' }, '500': { $ref: '#/components/responses/InternalError' } }
    delete:
      operationId: deleteProject
      description: Permanently delete a project and all of its tenant-owned resources. Only the organization owner may perform this operation; confirm_name must exactly match the current project name.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectID' }]
