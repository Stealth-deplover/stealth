        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createMessagingMessage
      description: Enqueue one encrypted message to the active subscribers of a topic. The 202 response means delivery work is queued, not that a provider accepted it. Idempotency-Key safely replays the same request.
      security: [{ sessionCookie: [] }, { projectApiKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectID' }
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, minLength: 1, maxLength: 128 }, description: Optional caller-generated key. Reusing it with a different request returns a conflict. }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateMessagingMessageRequest' } } } }
      responses:
        '202': { description: Message accepted for asynchronous delivery, content: { application/json: { schema: { $ref: '#/components/schemas/MessagingMessageResponse' } } } }
        '200': { description: Idempotent replay of an already accepted message, content: { application/json: { schema: { $ref: '#/components/schemas/MessagingMessageResponse' } } } }
