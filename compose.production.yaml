name: ${COMPOSE_PROJECT_NAME:-stealth}

# This file is deliberately image-first: release images are pinned by the
# operator through .env.production rather than rebuilt implicitly on a host.
# The local storage volume is the portable baseline; production installations
# using S3-compatible storage should set STORAGE_DRIVER=s3 and the STORAGE_S3_*
# values without adding another bundled service.
x-backend-environment: &backend-environment
  DATABASE_URL: "${DATABASE_URL:-postgres://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}?sslmode=disable}"
  DATABASE_MAX_CONNS: "${DATABASE_MAX_CONNS:-16}"
  DATABASE_MIN_CONNS: "${DATABASE_MIN_CONNS:-2}"
  DATABASE_MAX_CONN_LIFETIME: "${DATABASE_MAX_CONN_LIFETIME:-1h}"
  DATABASE_MAX_CONN_IDLE_TIME: "${DATABASE_MAX_CONN_IDLE_TIME:-30m}"
  REDIS_URL: "${REDIS_URL:-redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0}"
  FUNCTIONS_SECRET_KEY: "${FUNCTIONS_SECRET_KEY:?set FUNCTIONS_SECRET_KEY}"
  PUBLIC_APP_URL: "${PUBLIC_APP_URL:?set PUBLIC_APP_URL}"
  CLOUDFLARE_API_BASE_URL: "${CLOUDFLARE_API_BASE_URL:-}"
  CLOUDFLARE_RECONCILE_INTERVAL: "${CLOUDFLARE_RECONCILE_INTERVAL:-1m}"
  # Traefik platform routers target this narrow listener, never the
  # control-plane HTTP listener on 8080.
  PLATFORM_SITE_ADDR: "${PLATFORM_SITE_ADDR:-0.0.0.0:8082}"
  CONSOLE_CORS_ORIGINS: "${CONSOLE_CORS_ORIGINS:-}"
  COOKIE_SECURE: "${COOKIE_SECURE:-true}"
  SETUP_MODE: "${SETUP_MODE:-false}"
  STEALTH_SETUP_HANDOFF_FILE: "${STEALTH_SETUP_HANDOFF_FILE:-/var/lib/stealth/storage/.setup-handoff.enc}"
  TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-}"
  METRICS_TOKEN: "${METRICS_TOKEN:-}"
  PROJECT_OPERATION_RATE_LIMIT: "${PROJECT_OPERATION_RATE_LIMIT:-120}"
  PROJECT_OPERATION_RATE_WINDOW: "${PROJECT_OPERATION_RATE_WINDOW:-1m}"
  AUTH_RATE_LIMIT: "${AUTH_RATE_LIMIT:-10}"
  AUTH_RATE_WINDOW: "${AUTH_RATE_WINDOW:-1m}"
  STORAGE_ROOT: /var/lib/stealth/storage
  STORAGE_DRIVER: "${STORAGE_DRIVER:-local}"
  STORAGE_MAX_FILE_SIZE: "${STORAGE_MAX_FILE_SIZE:-50MiB}"
  STORAGE_DEFAULT_QUOTA_BYTES: "${STORAGE_DEFAULT_QUOTA_BYTES:-1GiB}"
  STORAGE_S3_ENDPOINT: "${STORAGE_S3_ENDPOINT:-}"
  STORAGE_S3_REGION: "${STORAGE_S3_REGION:-us-east-1}"
  STORAGE_S3_BUCKET: "${STORAGE_S3_BUCKET:-}"
  STORAGE_S3_ACCESS_KEY: "${STORAGE_S3_ACCESS_KEY:-}"
  STORAGE_S3_SECRET_KEY: "${STORAGE_S3_SECRET_KEY:-}"
  STORAGE_S3_USE_SSL: "${STORAGE_S3_USE_SSL:-true}"
  STORAGE_S3_PATH_STYLE: "${STORAGE_S3_PATH_STYLE:-true}"
  STORAGE_S3_PREFIX: "${STORAGE_S3_PREFIX:-}"
  FUNCTIONS_RUNNER_ENABLED: "${FUNCTIONS_RUNNER_ENABLED:-true}"
  FUNCTIONS_WORKER_ID: "${FUNCTIONS_WORKER_ID:-stealth-worker}"
  FUNCTIONS_RUNNER_POLL: "${FUNCTIONS_RUNNER_POLL:-500ms}"
  FUNCTIONS_RUNNER_LEASE_AGE: "${FUNCTIONS_RUNNER_LEASE_AGE:-20m}"
  FUNCTIONS_RUNNER_BUILD_TIMEOUT: "${FUNCTIONS_RUNNER_BUILD_TIMEOUT:-15m}"
  FUNCTIONS_RUNNER_STAGING_ROOT: /var/lib/stealth/runner-staging
  FUNCTIONS_RUNNER_STAGING_VOLUME: "${FUNCTIONS_RUNNER_STAGING_VOLUME:-stealth_function_runner_staging}"
  # The worker metrics listener is not published to the host. It binds on the
  # private Compose network so otel-collector can scrape it with METRICS_TOKEN.
  FUNCTIONS_RUNNER_METRICS_ADDR: 0.0.0.0:9091
  FUNCTIONS_RUNNER_HELPER_IMAGE: "${FUNCTIONS_RUNNER_HELPER_IMAGE:-alpine:3.22}"
  FUNCTIONS_RUNNER_NODE_IMAGE: "${FUNCTIONS_RUNNER_NODE_IMAGE:-node:22-alpine}"
  FUNCTIONS_RUNNER_PYTHON_IMAGE: "${FUNCTIONS_RUNNER_PYTHON_IMAGE:-python:3.13-alpine}"
  FUNCTIONS_RUNNER_GO_IMAGE: "${FUNCTIONS_RUNNER_GO_IMAGE:-golang:1.24-alpine}"
  AGENT_RUNNER_ENABLED: "${AGENT_RUNNER_ENABLED:-false}"
  AGENT_RUNNER_EXECUTION_TIMEOUT: "${AGENT_RUNNER_EXECUTION_TIMEOUT:-15m}"
  SITES_MAX_ARTIFACT_SIZE: "${SITES_MAX_ARTIFACT_SIZE:-50MiB}"
  SITES_DEFAULT_QUOTA_BYTES: "${SITES_DEFAULT_QUOTA_BYTES:-1GiB}"
  SITES_MAX_EXPANDED_BYTES: "${SITES_MAX_EXPANDED_BYTES:-256MiB}"
  SITES_MAX_FILES: "${SITES_MAX_FILES:-4096}"
  SITES_GIT_FETCH_CONCURRENCY: "${SITES_GIT_FETCH_CONCURRENCY:-4}"
  APPS_MAX_SOURCE_ARCHIVE_BYTES: "${APPS_MAX_SOURCE_ARCHIVE_BYTES:-128MiB}"
  APPS_MAX_EXPANDED_SOURCE_BYTES: "${APPS_MAX_EXPANDED_SOURCE_BYTES:-1GiB}"
  APPS_MAX_SOURCE_FILES: "${APPS_MAX_SOURCE_FILES:-8192}"
  APPS_MAX_IMAGE_ARCHIVE_BYTES: "${APPS_MAX_IMAGE_ARCHIVE_BYTES:-2GiB}"
  APPS_DEFAULT_ARTIFACT_QUOTA_BYTES: "${APPS_DEFAULT_ARTIFACT_QUOTA_BYTES:-5GiB}"
  APPS_BUILDKIT_ADDRESS: "${APPS_BUILDKIT_ADDRESS:-tcp://buildkit:1234}"
  APPS_BUILD_TIMEOUT: "${APPS_BUILD_TIMEOUT:-20m}"
  APPS_BUILD_LEASE_AGE: "${APPS_BUILD_LEASE_AGE:-25m}"
  APPS_BUILD_POLL_INTERVAL: "${APPS_BUILD_POLL_INTERVAL:-500ms}"
  APPS_BUILD_STAGING_ROOT: /var/lib/stealth/app-build-staging
  APPS_BUILD_STAGING_VOLUME: "${APPS_BUILD_STAGING_VOLUME:-stealth_app_build_staging}"
  APPS_BUILDKIT_STATE_VOLUME: "${APPS_BUILDKIT_STATE_VOLUME:-stealth_app_buildkit_state}"
  PLATFORM_ROUTE_RECONCILE_INTERVAL: "${PLATFORM_ROUTE_RECONCILE_INTERVAL:-5s}"
  # Keep these targets fixed so the worker's writable Compose mounts remain a
  # narrow, auditable boundary. Standalone deployments may override the
  # config defaults, but production Compose must not turn them into arbitrary
  # installation-root writes.
  TRAEFIK_GENERATED_DIR: /var/lib/stealth/traefik/generated
  TRAEFIK_RELOAD_FILE: /var/lib/stealth/traefik/.reload.yaml
  OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}"
  OTEL_TRACES_SAMPLER_ARG: "${OTEL_TRACES_SAMPLER_ARG:-0.1}"
  CLICKHOUSE_ADDR: "${CLICKHOUSE_ADDR:-clickhouse:9000}"
  CLICKHOUSE_DATABASE: "${CLICKHOUSE_DATABASE:-stealth_telemetry}"
  CLICKHOUSE_USER: "${CLICKHOUSE_USER:-stealth}"
  CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}"
  OTEL_COLLECTOR_HEALTH_URL: "${OTEL_COLLECTOR_HEALTH_URL:-http://otel-collector:13133}"
  TELEMETRY_MAX_QUERY_DURATION: "${TELEMETRY_MAX_QUERY_DURATION:-10s}"
  TELEMETRY_MAX_QUERY_RANGE: "${TELEMETRY_MAX_QUERY_RANGE:-720h}"
  TELEMETRY_MAX_QUERY_ROWS: "${TELEMETRY_MAX_QUERY_ROWS:-1000}"
  TELEMETRY_RETENTION: "${TELEMETRY_RETENTION:-720h}"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?set POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [stealth, ingress_control_db]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?set REDIS_PASSWORD}"
    command: ["sh", "-ec", "exec redis-server --requirepass \"$${REDIS_PASSWORD}\" --appendonly no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks: [stealth]

  clickhouse:
    image: "${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:26.8.6.5}"
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: "${CLICKHOUSE_DATABASE:-stealth_telemetry}"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-stealth}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    mem_limit: "${CLICKHOUSE_MEMORY_LIMIT:-1g}"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1' | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [telemetry_store]

  otel-collector:
    # This release image is derived from the pinned upstream contrib image and
    # adds only the scratch-compatible live health probe.
    image: "${OTEL_COLLECTOR_IMAGE:-ghcr.io/stealth-deplover/stealth-otel-collector:v0.2.2}"
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      CLICKHOUSE_ADDR: "${CLICKHOUSE_ADDR:-clickhouse:9000}"
      CLICKHOUSE_DATABASE: "${CLICKHOUSE_DATABASE:-stealth_telemetry}"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-stealth}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}"
      METRICS_TOKEN: "${METRICS_TOKEN:-}"
      POSTGRES_DB: "${POSTGRES_DB:?set POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?set REDIS_PASSWORD}"
      TELEMETRY_RETENTION: "${TELEMETRY_RETENTION:-720h}"
    volumes:
      - ./telemetry/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - otelcol_state:/var/lib/otelcol
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: "${OTEL_COLLECTOR_MEMORY_LIMIT:-512m}"
    depends_on:
      otelcol-state-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    healthcheck:
      # The upstream image is scratch-based and has no /bin/sh, curl, or wget.
      # Probe the live health_check extension with the small binary shipped in
      # the Stealth Collector wrapper image.
      test: ["CMD", "/usr/local/bin/telemetry-collector-healthcheck", "http://127.0.0.1:13133/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      stealth:
      telemetry_store:
      telemetry_ingest:

  telemetry-host:
    image: "${OTEL_HOST_COLLECTOR_IMAGE:-ghcr.io/stealth-deplover/stealth-otel-collector:v0.2.2}"
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./telemetry/host-metrics.yaml:/etc/otelcol-contrib/config.yaml:ro
      - /:/hostfs:ro
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: "${OTEL_HOST_COLLECTOR_MEMORY_LIMIT:-256m}"
    depends_on:
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/telemetry-collector-healthcheck", "http://127.0.0.1:13133/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks: [telemetry_ingest]

  telemetry-docker-logs:
    image: "${OTEL_DOCKER_LOGS_COLLECTOR_IMAGE:-ghcr.io/stealth-deplover/stealth-otel-docker-logs:v0.2.2}"
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./telemetry/docker-logs.yaml:/etc/otelcol-contrib/config.yaml:ro
      - otel_docker_logs_state:/var/lib/otelcol
      - /var/lib/docker/containers:/hostfs/var/lib/docker/containers:ro
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add:
      - DAC_READ_SEARCH
    # no-new-privileges would prevent the dedicated binary's file capability
    # from becoming effective for the non-root process.
    mem_limit: "${OTEL_DOCKER_LOGS_COLLECTOR_MEMORY_LIMIT:-256m}"
    depends_on:
      otel-collector:
        condition: service_healthy
      telemetry-docker-logs-state-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/telemetry-collector-healthcheck", "http://127.0.0.1:13133/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks: [telemetry_ingest]

  otelcol-state-init:
    image: "${OTEL_STATE_INIT_IMAGE:-alpine:3.24}"
    restart: "no"
    command: ["sh", "-ec", "mkdir -p /var/lib/otelcol/file_storage && chown -R 10001:10001 /var/lib/otelcol"]
    user: "0:0"
    network_mode: none
    volumes:
      - otelcol_state:/var/lib/otelcol

  traefik-state-init:
    # Docker performs this narrow bind-mount ownership handoff. The host CLI
    # remains usable by a normal installation user and never needs to chown
    # arbitrary files to the worker UID itself.
    image: "${OTEL_STATE_INIT_IMAGE:-alpine:3.24}"
    restart: "no"
    user: "0:0"
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    environment:
      STEALTH_TRAEFIK_HOST_UID: "${STEALTH_TRAEFIK_HOST_UID:-}"
    volumes:
      - ./traefik/dynamic:/state:rw
    command:
      - sh
      - -ec
      - |
        set -eu
        state=/state
        generated="$${state}/generated"
        reload="$${state}/.reload.yaml"
        if [ -L "$${state}" ] || [ ! -d "$${state}" ]; then
          printf '%s\n' 'Traefik state mount is not a normal directory' >&2
          exit 1
        fi
        if [ -e "$${generated}" ] || [ -L "$${generated}" ]; then
          if [ -L "$${generated}" ] || [ ! -d "$${generated}" ]; then
            printf '%s\n' 'Traefik generated state is not a normal directory' >&2
            exit 1
          fi
        else
          mkdir "$${generated}"
        fi
        if [ -e "$${state}/core.yaml" ] || [ -L "$${state}/core.yaml" ]; then
          if [ -L "$${state}/core.yaml" ] || [ ! -f "$${state}/core.yaml" ]; then
            printf '%s\n' 'Traefik core.yaml is not a normal file' >&2
            exit 1
          fi
        fi
        if [ -L "$${reload}" ] || { [ -e "$${reload}" ] && [ ! -f "$${reload}" ]; }; then
          printf '%s\n' 'Traefik reload state is not a normal file' >&2
          exit 1
        fi
        if [ ! -e "$${reload}" ]; then
          printf '%s\n' '# Top-level file-provider reload sentinel.' >"$${reload}"
        fi
        state_uid="$${STEALTH_TRAEFIK_HOST_UID:-}"
        if [ -z "$${state_uid}" ]; then
          state_uid="$$(stat -c '%u' "$${state}")"
        fi
        case "$${state_uid}" in
          ''|*[!0-9]*)
            printf '%s\n' 'Traefik host UID is invalid' >&2
            exit 1
            ;;
        esac
        # Keep the invoking host user as owner so later normal-user upgrades
        # can still replace release-managed assets. The fixed worker group is
        # the only additional write principal; no recursive ownership change
        # reaches core.yaml or any other installation file.
        chown "$${state_uid}:10001" "$${state}" "$${generated}" "$${reload}"
        chmod 0775 "$${state}" "$${generated}"
        chmod 0664 "$${reload}"

  cloudflare-state-init:
    # Decrypt legacy state only in this isolated one-shot process, then publish
    # a typed Cloudflare-only encrypted artifact for the production worker.
    image: "${STEALTH_WORKER_IMAGE:?set STEALTH_WORKER_IMAGE to a versioned image}"
    restart: "no"
    user: "0:0"
    network_mode: none
    read_only: true
    entrypoint: ["/usr/local/bin/stealth-cloudflare-import-init"]
    environment:
      FUNCTIONS_SECRET_KEY: "${FUNCTIONS_SECRET_KEY:?set FUNCTIONS_SECRET_KEY}"
    volumes:
      - ./state:/state:ro
      - ./state/.cloudflare-import:/output:rw

  telemetry-docker-logs-state-init:
    image: "${OTEL_STATE_INIT_IMAGE:-alpine:3.24}"
    restart: "no"
    command: ["sh", "-ec", "mkdir -p /var/lib/otelcol/file_storage && chown -R 10001:10001 /var/lib/otelcol"]
    user: "0:0"
    network_mode: none
    volumes:
      - otel_docker_logs_state:/var/lib/otelcol

  telemetry-docker-proxy:
    image: "${STEALTH_TELEMETRY_DOCKER_PROXY_IMAGE:?set STEALTH_TELEMETRY_DOCKER_PROXY_IMAGE to a versioned image}"
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID to the group ID of /var/run/docker.sock}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: "${OTEL_DOCKER_PROXY_MEMORY_LIMIT:-64m}"
    expose: ["2375"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/telemetry-docker-proxy", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks: [telemetry_docker]

  telemetry-docker:
    image: "${OTEL_DOCKER_COLLECTOR_IMAGE:-ghcr.io/stealth-deplover/stealth-otel-collector:v0.2.2}"
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./telemetry/docker-stats.yaml:/etc/otelcol-contrib/config.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: "${OTEL_DOCKER_COLLECTOR_MEMORY_LIMIT:-256m}"
    depends_on:
      otel-collector:
        condition: service_healthy
      telemetry-docker-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/telemetry-collector-healthcheck", "http://127.0.0.1:13133/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      telemetry_docker:
      telemetry_ingest:

  migrate:
    image: "${STEALTH_MIGRATE_IMAGE:?set STEALTH_MIGRATE_IMAGE to a versioned image}"
    restart: "no"
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgres://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}?sslmode=disable}"
      DATABASE_MAX_CONNS: "${DATABASE_MAX_CONNS:-16}"
      DATABASE_MIN_CONNS: "${DATABASE_MIN_CONNS:-2}"
      DATABASE_MAX_CONN_LIFETIME: "${DATABASE_MAX_CONN_LIFETIME:-1h}"
      DATABASE_MAX_CONN_IDLE_TIME: "${DATABASE_MAX_CONN_IDLE_TIME:-30m}"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [stealth]

  api:
    image: "${STEALTH_API_IMAGE:?set STEALTH_API_IMAGE to a versioned image}"
    restart: unless-stopped
    environment:
      <<: *backend-environment
      CLICKHOUSE_ADDR: "${CLICKHOUSE_ADDR:-clickhouse:9000}"
      CLICKHOUSE_DATABASE: "${CLICKHOUSE_DATABASE:-stealth_telemetry}"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-stealth}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}"
      OTEL_COLLECTOR_HEALTH_URL: "${OTEL_COLLECTOR_HEALTH_URL:-http://otel-collector:13133}"
      TELEMETRY_MAX_QUERY_DURATION: "${TELEMETRY_MAX_QUERY_DURATION:-10s}"
      TELEMETRY_MAX_QUERY_RANGE: "${TELEMETRY_MAX_QUERY_RANGE:-720h}"
      TELEMETRY_MAX_QUERY_ROWS: "${TELEMETRY_MAX_QUERY_ROWS:-1000}"
      TELEMETRY_RETENTION: "${TELEMETRY_RETENTION:-720h}"
      BOOTSTRAP_CLI_KEY: "${BOOTSTRAP_CLI_KEY:?set BOOTSTRAP_CLI_KEY}"
      GITHUB_APP_CLIENT_ID: "${GITHUB_APP_CLIENT_ID:-}"
    volumes:
      - stealth_storage:/var/lib/stealth/storage
    ports:
      - "127.0.0.1:${API_HOST_PORT:-18080}:8080"
    expose: ["8082"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/readyz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      stealth:
        aliases: [stealth-api]
      telemetry_store:
      stealth_ingress:

  buildkit-worker-credentials-init:
    image: "${OTEL_STATE_INIT_IMAGE:-alpine:3.24}"
    restart: "no"
    user: "0:0"
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    volumes:
      - ./state/buildkit-mtls/ca-cert.pem:/input/ca.pem:ro
      - ./state/buildkit-mtls/worker/cert.pem:/input/client-cert.pem:ro
      - ./state/buildkit-mtls/worker/key.pem:/input/client-key.pem:ro
      - buildkit_worker_credentials:/output
    command:
      - sh
      - -ec
      - |
        set -eu
        chmod 0755 /output
        for stale in /output/* /output/.[!.]* /output/..?*; do [ ! -e "$stale" ] && [ ! -L "$stale" ] || rm -rf -- "$stale"; done
        install -m 0444 /input/ca.pem /output/ca.pem
        install -m 0444 /input/client-cert.pem /output/client-cert.pem
        install -m 0400 /input/client-key.pem /output/client-key.pem
        chown 10001:10001 /output/ca.pem /output/client-cert.pem /output/client-key.pem

  buildkit-server-credentials-init:
    image: "${OTEL_STATE_INIT_IMAGE:-alpine:3.24}"
    restart: "no"
    user: "0:0"
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    volumes:
      - ./state/buildkit-mtls/ca-cert.pem:/input/ca.pem:ro
      - ./state/buildkit-mtls/server/cert.pem:/input/server-cert.pem:ro
      - ./state/buildkit-mtls/server/key.pem:/input/server-key.pem:ro
      - ./state/buildkit-mtls/health/cert.pem:/input/health-client-cert.pem:ro
      - ./state/buildkit-mtls/health/key.pem:/input/health-client-key.pem:ro
      - buildkit_server_credentials:/output
    command:
      - sh
      - -ec
      - |
        set -eu
        chmod 0755 /output
        for stale in /output/* /output/.[!.]* /output/..?*; do [ ! -e "$stale" ] && [ ! -L "$stale" ] || rm -rf -- "$stale"; done
        install -m 0444 /input/ca.pem /output/ca.pem
        install -m 0444 /input/server-cert.pem /output/server-cert.pem
        install -m 0400 /input/server-key.pem /output/server-key.pem
        install -m 0444 /input/health-client-cert.pem /output/health-client-cert.pem
        install -m 0400 /input/health-client-key.pem /output/health-client-key.pem
        chown 1000:1000 /output/ca.pem /output/server-cert.pem /output/server-key.pem /output/health-client-cert.pem /output/health-client-key.pem

  worker:
    image: "${STEALTH_WORKER_IMAGE:?set STEALTH_WORKER_IMAGE to a versioned image}"
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      <<: *backend-environment
      CLOUDFLARE_IMPORT_FILE: /var/lib/stealth/cloudflare-import/cloudflare-import.enc
      APPS_BUILDKIT_CA_CERT: "${APPS_BUILDKIT_CA_CERT:-/run/secrets/stealth-buildkit/ca.pem}"
      APPS_BUILDKIT_CLIENT_CERT: "${APPS_BUILDKIT_CLIENT_CERT:-/run/secrets/stealth-buildkit/client-cert.pem}"
      APPS_BUILDKIT_CLIENT_KEY: "${APPS_BUILDKIT_CLIENT_KEY:-/run/secrets/stealth-buildkit/client-key.pem}"
    volumes:
      - stealth_storage:/var/lib/stealth/storage
      - function_runner_staging:/var/lib/stealth/runner-staging
      - app_build_staging:/var/lib/stealth/app-build-staging
      # The parent directory is required for atomic replacement of the
      # top-level reload sentinel. The release-managed core file is overlaid
      # read-only at the same path, so the worker cannot modify or replace it;
      # the static Traefik file and installation root are not mounted.
      - ./traefik/dynamic:/var/lib/stealth/traefik:rw
      - ./traefik/dynamic/core.yaml:/var/lib/stealth/traefik/core.yaml:ro
      - ./state/.cloudflare-import:/var/lib/stealth/cloudflare-import:ro
      - buildkit_worker_credentials:/run/secrets/stealth-buildkit:ro
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID to the group ID of /var/run/docker.sock}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      traefik-state-init:
        condition: service_completed_successfully
      cloudflare-state-init:
        condition: service_completed_successfully
      buildkit-worker-credentials-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9091/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      stealth:
      telemetry_store:
      app_build:

  buildkit:
    # v0.33.0 multi-architecture manifest digest, matching buildctl copied
    # into the worker image. This service is isolated to app_build.
    image: moby/buildkit:v0.33.0-rootless@sha256:80b15f0735e87bab7bf59ec4d695dfb4a7cfb25521cf56dc75d6f256285b63ef
    restart: unless-stopped
    user: "1000:1000"
    command: ["--addr", "tcp://0.0.0.0:1234", "--config", "/etc/buildkit/buildkitd.toml"]
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
      - /run/user/1000:mode=0700,uid=1000,gid=1000,size=16m
      # Mounts hide the image's pre-owned paths, so assign the rootless user
      # explicitly for its transient rootlesskit namespace state.
      - /home/user/.local/tmp:mode=0700,uid=1000,gid=1000,size=64m
    security_opt:
      # Required by the official rootless BuildKit image to establish its
      # nested user/mount namespaces. The service remains non-privileged and
      # receives no host namespace or socket access.
      - seccomp=unconfined
      - apparmor=${APPS_BUILDKIT_APPARMOR_PROFILE:-unconfined}
      - systempaths=unconfined
    mem_limit: "${APPS_BUILDKIT_MEMORY_LIMIT:-4g}"
    pids_limit: 4096
    volumes:
      - ./buildkit/buildkitd.toml:/etc/buildkit/buildkitd.toml:ro
      - buildkit_server_credentials:/run/secrets/stealth-buildkit:ro
      - buildkit_state:/home/user/.local/share/buildkit
    depends_on:
      buildkit-server-credentials-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "buildctl", "--addr", "tcp://buildkit:1234", "--tlscacert", "/run/secrets/stealth-buildkit/ca.pem", "--tlscert", "/run/secrets/stealth-buildkit/health-client-cert.pem", "--tlskey", "/run/secrets/stealth-buildkit/health-client-key.pem", "debug", "workers"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks: [app_build]

  ingress-control:
    image: "${STEALTH_INGRESS_CONTROL_IMAGE:?set STEALTH_INGRESS_CONTROL_IMAGE to a versioned image}"
    profiles: [maintenance]
    restart: "no"
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgres://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}?sslmode=disable}"
      FUNCTIONS_SECRET_KEY: "${FUNCTIONS_SECRET_KEY:?set FUNCTIONS_SECRET_KEY}"
      PUBLIC_APP_URL: "${PUBLIC_APP_URL:?set PUBLIC_APP_URL}"
      CLOUDFLARE_API_BASE_URL: "${CLOUDFLARE_API_BASE_URL:-}"
    networks: [ingress_control_db, stealth_ingress]

  console:
    image: "${STEALTH_CONSOLE_IMAGE:?set STEALTH_CONSOLE_IMAGE to a versioned image}"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:${CONSOLE_HOST_PORT:-13000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      stealth:
        aliases: [stealth-web]
      stealth_ingress:

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      console:
        condition: service_healthy
    volumes:
      - ./console/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${PROXY_HTTP_BIND:-0.0.0.0}:${PROXY_HTTP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [stealth]

  traefik:
    # Traefik handles platform Site requests received through the private
    # Cloudflare ingress network. It has no published host port; Nginx remains
    # the Console/API origin for the existing named tunnel.
    image: "${TRAEFIK_IMAGE:-traefik:v3.7.13@sha256:1c32e7c368204fd72812152ebdd2ac0425993df6fd982317deb02e48f2d5423c}"
    restart: unless-stopped
    command: ["--configFile=/etc/traefik/traefik.yaml"]
    volumes:
      - ./traefik/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    read_only: true
    tmpfs:
      - /tmp
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: "${TRAEFIK_MEMORY_LIMIT:-128m}"
    expose: ["8080", "8081"]
    depends_on:
      traefik-state-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      stealth_ingress:
        # The peer is persisted by the installer and intentionally sits
        # outside the dynamic workload pool.
        ipv4_address: "${STEALTH_TRAEFIK_INGRESS_IP:?set STEALTH_TRAEFIK_INGRESS_IP}"

  cloudflared:
    image: "${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.9.0}"
    profiles: [cloudflare]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/secrets/cloudflare-tunnel-token"]
    volumes:
      - "${CLOUDFLARE_TUNNEL_TOKEN_FILE:-./state/cloudflare-tunnel-token}:/run/secrets/cloudflare-tunnel-token:ro"
    depends_on:
      proxy:
        condition: service_healthy
    networks:
      stealth:
      # Keep the workload origin attachment available without changing the
      # Console's remotely configured tunnel origin (still proxy/Nginx).
      stealth_ingress:
        ipv4_address: "${STEALTH_CLOUDFLARED_INGRESS_IP:?set STEALTH_CLOUDFLARED_INGRESS_IP}"

volumes:
  postgres_data:
    name: "${POSTGRES_VOLUME_NAME:-stealth_postgres_data}"
  stealth_storage:
    name: "${STORAGE_VOLUME_NAME:-stealth_storage}"
  function_runner_staging:
    name: "${FUNCTIONS_RUNNER_STAGING_VOLUME:-stealth_function_runner_staging}"
  app_build_staging:
    name: "${APPS_BUILD_STAGING_VOLUME:-stealth_app_build_staging}"
  buildkit_state:
    name: "${APPS_BUILDKIT_STATE_VOLUME:-stealth_app_buildkit_state}"
  buildkit_worker_credentials:
    name: "${COMPOSE_PROJECT_NAME:-stealth}_app_buildkit_worker_credentials"
  buildkit_server_credentials:
    name: "${COMPOSE_PROJECT_NAME:-stealth}_app_buildkit_server_credentials"
  clickhouse_data:
    name: "${CLICKHOUSE_VOLUME_NAME:-stealth_clickhouse_data}"
  otelcol_state:
    name: "${OTELCOL_VOLUME_NAME:-stealth_otelcol_state}"
  otel_docker_logs_state:
    name: "${OTEL_DOCKER_LOGS_VOLUME_NAME:-stealth_otel_docker_logs_state}"

networks:
  stealth:
    name: "${STEALTH_NETWORK_NAME:-stealth_network}"
    ipam:
      config:
        - subnet: "${STEALTH_NETWORK_SUBNET:-172.30.0.0/24}"
  ingress_control_db:
    name: "${STEALTH_CONTROL_DB_NETWORK_NAME:-stealth_control_db}"
  telemetry_store:
    name: "${STEALTH_TELEMETRY_STORE_NETWORK_NAME:-stealth_telemetry_store}"
    internal: true
  telemetry_ingest:
    name: "${STEALTH_TELEMETRY_INGEST_NETWORK_NAME:-stealth_telemetry_ingest}"
    internal: true
  telemetry_docker:
    name: "${STEALTH_TELEMETRY_DOCKER_NETWORK_NAME:-stealth_telemetry_docker}"
    internal: true
  stealth_ingress:
    name: "${STEALTH_INGRESS_NETWORK_NAME:-stealth_ingress}"
    internal: true
    ipam:
      config:
        # The installer persists the subnet and pool per installation. Fixed
        # infrastructure peers are outside this range so dynamic app/workload
        # allocation cannot consume trusted addresses.
        - subnet: "${STEALTH_INGRESS_NETWORK_SUBNET:?set STEALTH_INGRESS_NETWORK_SUBNET}"
          ip_range: "${STEALTH_INGRESS_IP_RANGE:?set STEALTH_INGRESS_IP_RANGE}"
  app_build:
    name: "${APPS_BUILD_NETWORK_NAME:-stealth_app_build}"
