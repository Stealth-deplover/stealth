name: ${COMPOSE_PROJECT_NAME:-stealth}

# This file is deliberately image-first: release images are pinned by the
# operator through .env.production rather than rebuilt implicitly on a host.
# The local storage volume is the portable baseline; production installations
# using S3-compatible storage should set STORAGE_DRIVER=s3 and the STORAGE_S3_*
# values without adding another bundled service.
x-backend-environment: &backend-environment
  DATABASE_URL: "${DATABASE_URL:-postgres://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}?sslmode=disable}"
  DATABASE_MAX_CONNS: "${DATABASE_MAX_CONNS:-16}"
  DATABASE_MIN_CONNS: "${DATABASE_MIN_CONNS:-2}"
  DATABASE_MAX_CONN_LIFETIME: "${DATABASE_MAX_CONN_LIFETIME:-1h}"
  DATABASE_MAX_CONN_IDLE_TIME: "${DATABASE_MAX_CONN_IDLE_TIME:-30m}"
  REDIS_URL: "${REDIS_URL:-redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0}"
  FUNCTIONS_SECRET_KEY: "${FUNCTIONS_SECRET_KEY:?set FUNCTIONS_SECRET_KEY}"
  PUBLIC_APP_URL: "${PUBLIC_APP_URL:?set PUBLIC_APP_URL}"
  CONSOLE_CORS_ORIGINS: "${CONSOLE_CORS_ORIGINS:-}"
  COOKIE_SECURE: "${COOKIE_SECURE:-true}"
  SETUP_MODE: "${SETUP_MODE:-false}"
  STEALTH_SETUP_HANDOFF_FILE: "${STEALTH_SETUP_HANDOFF_FILE:-/var/lib/stealth/storage/.setup-handoff.enc}"
  TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-}"
  METRICS_TOKEN: "${METRICS_TOKEN:-}"
  PROJECT_OPERATION_RATE_LIMIT: "${PROJECT_OPERATION_RATE_LIMIT:-120}"
  PROJECT_OPERATION_RATE_WINDOW: "${PROJECT_OPERATION_RATE_WINDOW:-1m}"
  AUTH_RATE_LIMIT: "${AUTH_RATE_LIMIT:-10}"
  AUTH_RATE_WINDOW: "${AUTH_RATE_WINDOW:-1m}"
  STORAGE_ROOT: /var/lib/stealth/storage
  STORAGE_DRIVER: "${STORAGE_DRIVER:-local}"
  STORAGE_MAX_FILE_SIZE: "${STORAGE_MAX_FILE_SIZE:-50MiB}"
  STORAGE_DEFAULT_QUOTA_BYTES: "${STORAGE_DEFAULT_QUOTA_BYTES:-1GiB}"
  STORAGE_S3_ENDPOINT: "${STORAGE_S3_ENDPOINT:-}"
  STORAGE_S3_REGION: "${STORAGE_S3_REGION:-us-east-1}"
  STORAGE_S3_BUCKET: "${STORAGE_S3_BUCKET:-}"
  STORAGE_S3_ACCESS_KEY: "${STORAGE_S3_ACCESS_KEY:-}"
  STORAGE_S3_SECRET_KEY: "${STORAGE_S3_SECRET_KEY:-}"
  STORAGE_S3_USE_SSL: "${STORAGE_S3_USE_SSL:-true}"
  STORAGE_S3_PATH_STYLE: "${STORAGE_S3_PATH_STYLE:-true}"
  STORAGE_S3_PREFIX: "${STORAGE_S3_PREFIX:-}"
  FUNCTIONS_RUNNER_ENABLED: "${FUNCTIONS_RUNNER_ENABLED:-true}"
  FUNCTIONS_WORKER_ID: "${FUNCTIONS_WORKER_ID:-stealth-worker}"
  FUNCTIONS_RUNNER_POLL: "${FUNCTIONS_RUNNER_POLL:-500ms}"
  FUNCTIONS_RUNNER_LEASE_AGE: "${FUNCTIONS_RUNNER_LEASE_AGE:-20m}"
  FUNCTIONS_RUNNER_BUILD_TIMEOUT: "${FUNCTIONS_RUNNER_BUILD_TIMEOUT:-15m}"
  FUNCTIONS_RUNNER_STAGING_ROOT: /var/lib/stealth/runner-staging
  FUNCTIONS_RUNNER_STAGING_VOLUME: "${FUNCTIONS_RUNNER_STAGING_VOLUME:-stealth_function_runner_staging}"
  # The worker metrics listener is not published to the host. It binds on the
  # private Compose network so otel-collector can scrape it with METRICS_TOKEN.
  FUNCTIONS_RUNNER_METRICS_ADDR: 0.0.0.0:9091
  FUNCTIONS_RUNNER_HELPER_IMAGE: "${FUNCTIONS_RUNNER_HELPER_IMAGE:-alpine:3.22}"
  FUNCTIONS_RUNNER_NODE_IMAGE: "${FUNCTIONS_RUNNER_NODE_IMAGE:-node:22-alpine}"
  FUNCTIONS_RUNNER_PYTHON_IMAGE: "${FUNCTIONS_RUNNER_PYTHON_IMAGE:-python:3.13-alpine}"
  FUNCTIONS_RUNNER_GO_IMAGE: "${FUNCTIONS_RUNNER_GO_IMAGE:-golang:1.24-alpine}"
  AGENT_RUNNER_ENABLED: "${AGENT_RUNNER_ENABLED:-false}"
  AGENT_RUNNER_EXECUTION_TIMEOUT: "${AGENT_RUNNER_EXECUTION_TIMEOUT:-15m}"
  SITES_MAX_ARTIFACT_SIZE: "${SITES_MAX_ARTIFACT_SIZE:-50MiB}"
  SITES_DEFAULT_QUOTA_BYTES: "${SITES_DEFAULT_QUOTA_BYTES:-1GiB}"
  SITES_MAX_EXPANDED_BYTES: "${SITES_MAX_EXPANDED_BYTES:-256MiB}"
  SITES_MAX_FILES: "${SITES_MAX_FILES:-4096}"
  SITES_GIT_FETCH_CONCURRENCY: "${SITES_GIT_FETCH_CONCURRENCY:-4}"
  OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}"
  OTEL_TRACES_SAMPLER_ARG: "${OTEL_TRACES_SAMPLER_ARG:-0.1}"
  CLICKHOUSE_ADDR: "${CLICKHOUSE_ADDR:-clickhouse:9000}"
  CLICKHOUSE_DATABASE: "${CLICKHOUSE_DATABASE:-stealth_telemetry}"
  CLICKHOUSE_USER: "${CLICKHOUSE_USER:-stealth}"
  CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}"
  OTEL_COLLECTOR_HEALTH_URL: "${OTEL_COLLECTOR_HEALTH_URL:-http://otel-collector:13133}"
  TELEMETRY_MAX_QUERY_DURATION: "${TELEMETRY_MAX_QUERY_DURATION:-10s}"
  TELEMETRY_MAX_QUERY_RANGE: "${TELEMETRY_MAX_QUERY_RANGE:-720h}"
  TELEMETRY_MAX_QUERY_ROWS: "${TELEMETRY_MAX_QUERY_ROWS:-1000}"
  TELEMETRY_RETENTION: "${TELEMETRY_RETENTION:-720h}"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?set POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [stealth]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?set REDIS_PASSWORD}"
    command: ["sh", "-ec", "exec redis-server --requirepass \"$${REDIS_PASSWORD}\" --appendonly no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks: [stealth]

  clickhouse:
    image: "${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:26.8.6.5}"
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: "${CLICKHOUSE_DATABASE:-stealth_telemetry}"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-stealth}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    mem_limit: "${CLICKHOUSE_MEMORY_LIMIT:-1g}"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1' | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [telemetry_store]

  otel-collector:
    # This release image is derived from the pinned upstream contrib image and
    # adds only the scratch-compatible live health probe.
    image: "${OTEL_COLLECTOR_IMAGE:-ghcr.io/stealth-deplover/stealth-otel-collector:v0.2.2}"
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      CLICKHOUSE_ADDR: "${CLICKHOUSE_ADDR:-clickhouse:9000}"
      CLICKHOUSE_DATABASE: "${CLICKHOUSE_DATABASE:-stealth_telemetry}"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-stealth}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}"
      METRICS_TOKEN: "${METRICS_TOKEN:-}"
      POSTGRES_DB: "${POSTGRES_DB:?set POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?set REDIS_PASSWORD}"
      TELEMETRY_RETENTION: "${TELEMETRY_RETENTION:-720h}"
    volumes:
      - ./telemetry/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - otelcol_state:/var/lib/otelcol
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: "${OTEL_COLLECTOR_MEMORY_LIMIT:-512m}"
    depends_on:
      otelcol-state-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    healthcheck:
      # The upstream image is scratch-based and has no /bin/sh, curl, or wget.
      # Probe the live health_check extension with the small binary shipped in
      # the Stealth Collector wrapper image.
      test: ["CMD", "/usr/local/bin/telemetry-collector-healthcheck", "http://127.0.0.1:13133/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      stealth:
      telemetry_store:
      telemetry_ingest:

  telemetry-host:
    image: "${OTEL_HOST_COLLECTOR_IMAGE:-ghcr.io/stealth-deplover/stealth-otel-collector:v0.2.2}"
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./telemetry/host-metrics.yaml:/etc/otelcol-contrib/config.yaml:ro
      - /:/hostfs:ro
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: "${OTEL_HOST_COLLECTOR_MEMORY_LIMIT:-256m}"
    depends_on:
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/telemetry-collector-healthcheck", "http://127.0.0.1:13133/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks: [telemetry_ingest]

  telemetry-docker-logs:
    image: "${OTEL_DOCKER_LOGS_COLLECTOR_IMAGE:-ghcr.io/stealth-deplover/stealth-otel-docker-logs:v0.2.2}"
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./telemetry/docker-logs.yaml:/etc/otelcol-contrib/config.yaml:ro
      - otel_docker_logs_state:/var/lib/otelcol
      - /var/lib/docker/containers:/hostfs/var/lib/docker/containers:ro
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add:
      - DAC_READ_SEARCH
    # no-new-privileges would prevent the dedicated binary's file capability
    # from becoming effective for the non-root process.
    mem_limit: "${OTEL_DOCKER_LOGS_COLLECTOR_MEMORY_LIMIT:-256m}"
    depends_on:
      otel-collector:
        condition: service_healthy
      telemetry-docker-logs-state-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/telemetry-collector-healthcheck", "http://127.0.0.1:13133/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks: [telemetry_ingest]

  otelcol-state-init:
    image: "${OTEL_STATE_INIT_IMAGE:-alpine:3.24}"
    restart: "no"
    command: ["sh", "-ec", "mkdir -p /var/lib/otelcol/file_storage && chown -R 10001:10001 /var/lib/otelcol"]
    user: "0:0"
    network_mode: none
    volumes:
      - otelcol_state:/var/lib/otelcol

  telemetry-docker-logs-state-init:
    image: "${OTEL_STATE_INIT_IMAGE:-alpine:3.24}"
    restart: "no"
    command: ["sh", "-ec", "mkdir -p /var/lib/otelcol/file_storage && chown -R 10001:10001 /var/lib/otelcol"]
    user: "0:0"
    network_mode: none
    volumes:
      - otel_docker_logs_state:/var/lib/otelcol

  telemetry-docker-proxy:
    image: "${STEALTH_TELEMETRY_DOCKER_PROXY_IMAGE:?set STEALTH_TELEMETRY_DOCKER_PROXY_IMAGE to a versioned image}"
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID to the group ID of /var/run/docker.sock}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: "${OTEL_DOCKER_PROXY_MEMORY_LIMIT:-64m}"
    expose: ["2375"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/telemetry-docker-proxy", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks: [telemetry_docker]

  telemetry-docker:
    image: "${OTEL_DOCKER_COLLECTOR_IMAGE:-ghcr.io/stealth-deplover/stealth-otel-collector:v0.2.2}"
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./telemetry/docker-stats.yaml:/etc/otelcol-contrib/config.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: "${OTEL_DOCKER_COLLECTOR_MEMORY_LIMIT:-256m}"
    depends_on:
      otel-collector:
        condition: service_healthy
      telemetry-docker-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/telemetry-collector-healthcheck", "http://127.0.0.1:13133/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      telemetry_docker:
      telemetry_ingest:

  migrate:
    image: "${STEALTH_MIGRATE_IMAGE:?set STEALTH_MIGRATE_IMAGE to a versioned image}"
    restart: "no"
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgres://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}?sslmode=disable}"
      DATABASE_MAX_CONNS: "${DATABASE_MAX_CONNS:-16}"
      DATABASE_MIN_CONNS: "${DATABASE_MIN_CONNS:-2}"
      DATABASE_MAX_CONN_LIFETIME: "${DATABASE_MAX_CONN_LIFETIME:-1h}"
      DATABASE_MAX_CONN_IDLE_TIME: "${DATABASE_MAX_CONN_IDLE_TIME:-30m}"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [stealth]

  api:
    image: "${STEALTH_API_IMAGE:?set STEALTH_API_IMAGE to a versioned image}"
    restart: unless-stopped
    environment:
      <<: *backend-environment
      CLICKHOUSE_ADDR: "${CLICKHOUSE_ADDR:-clickhouse:9000}"
      CLICKHOUSE_DATABASE: "${CLICKHOUSE_DATABASE:-stealth_telemetry}"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-stealth}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}"
      OTEL_COLLECTOR_HEALTH_URL: "${OTEL_COLLECTOR_HEALTH_URL:-http://otel-collector:13133}"
      TELEMETRY_MAX_QUERY_DURATION: "${TELEMETRY_MAX_QUERY_DURATION:-10s}"
      TELEMETRY_MAX_QUERY_RANGE: "${TELEMETRY_MAX_QUERY_RANGE:-720h}"
      TELEMETRY_MAX_QUERY_ROWS: "${TELEMETRY_MAX_QUERY_ROWS:-1000}"
      TELEMETRY_RETENTION: "${TELEMETRY_RETENTION:-720h}"
      BOOTSTRAP_CLI_KEY: "${BOOTSTRAP_CLI_KEY:?set BOOTSTRAP_CLI_KEY}"
      GITHUB_APP_CLIENT_ID: "${GITHUB_APP_CLIENT_ID:-}"
    volumes:
      - stealth_storage:/var/lib/stealth/storage
    ports:
      - "127.0.0.1:${API_HOST_PORT:-18080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/readyz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      stealth:
        aliases: [stealth-api]
      telemetry_store:
      stealth_ingress:

  worker:
    image: "${STEALTH_WORKER_IMAGE:?set STEALTH_WORKER_IMAGE to a versioned image}"
    restart: unless-stopped
    stop_grace_period: 30s
    environment: *backend-environment
    volumes:
      - stealth_storage:/var/lib/stealth/storage
      - function_runner_staging:/var/lib/stealth/runner-staging
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID to the group ID of /var/run/docker.sock}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9091/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      stealth:
      telemetry_store:

  console:
    image: "${STEALTH_CONSOLE_IMAGE:?set STEALTH_CONSOLE_IMAGE to a versioned image}"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:${CONSOLE_HOST_PORT:-13000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      stealth:
        aliases: [stealth-web]
      stealth_ingress:

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      console:
        condition: service_healthy
    volumes:
      - ./console/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${PROXY_HTTP_BIND:-0.0.0.0}:${PROXY_HTTP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [stealth]

  traefik:
    # Traefik is the future data-plane ingress. Nginx remains the active
    # external entrypoint in this release; this service is intentionally
    # internal-only so the migration has no public cutover side effect.
    image: "${TRAEFIK_IMAGE:-traefik:v3.7.13@sha256:1c32e7c368204fd72812152ebdd2ac0425993df6fd982317deb02e48f2d5423c}"
    restart: unless-stopped
    command: ["--configFile=/etc/traefik/traefik.yaml"]
    volumes:
      - ./traefik/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    read_only: true
    tmpfs:
      - /tmp
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: "${TRAEFIK_MEMORY_LIMIT:-128m}"
    expose: ["8080", "8081"]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      stealth_ingress:
        ipv4_address: 172.31.0.2

  cloudflared:
    image: "${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.9.0}"
    profiles: [cloudflare]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/secrets/cloudflare-tunnel-token"]
    volumes:
      - "${CLOUDFLARE_TUNNEL_TOKEN_FILE:-./state/cloudflare-tunnel-token}:/run/secrets/cloudflare-tunnel-token:ro"
    depends_on:
      proxy:
        condition: service_healthy
    networks:
      stealth:
      # Keep the future origin attachment ready without changing the current
      # remotely configured Cloudflare Tunnel origin (still proxy/Nginx).
      stealth_ingress:
        ipv4_address: 172.31.0.10

volumes:
  postgres_data:
    name: "${POSTGRES_VOLUME_NAME:-stealth_postgres_data}"
  stealth_storage:
    name: "${STORAGE_VOLUME_NAME:-stealth_storage}"
  function_runner_staging:
    name: "${FUNCTIONS_RUNNER_STAGING_VOLUME:-stealth_function_runner_staging}"
  clickhouse_data:
    name: "${CLICKHOUSE_VOLUME_NAME:-stealth_clickhouse_data}"
  otelcol_state:
    name: "${OTELCOL_VOLUME_NAME:-stealth_otelcol_state}"
  otel_docker_logs_state:
    name: "${OTEL_DOCKER_LOGS_VOLUME_NAME:-stealth_otel_docker_logs_state}"

networks:
  stealth:
    name: "${STEALTH_NETWORK_NAME:-stealth_network}"
    ipam:
      config:
        - subnet: "${STEALTH_NETWORK_SUBNET:-172.30.0.0/24}"
  telemetry_store:
    name: "${STEALTH_TELEMETRY_STORE_NETWORK_NAME:-stealth_telemetry_store}"
    internal: true
  telemetry_ingest:
    name: "${STEALTH_TELEMETRY_INGEST_NETWORK_NAME:-stealth_telemetry_ingest}"
    internal: true
  telemetry_docker:
    name: "${STEALTH_TELEMETRY_DOCKER_NETWORK_NAME:-stealth_telemetry_docker}"
    internal: true
  stealth_ingress:
    name: "${STEALTH_INGRESS_NETWORK_NAME:-stealth_ingress}"
    internal: true
    ipam:
      config:
        # Fixed addresses below are part of the forwarded-header trust model;
        # keep this dedicated subnet stable and customize only the network
        # name when multiple installations share a Docker host.
        - subnet: "172.31.0.0/24"
