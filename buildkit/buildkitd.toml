# Dedicated cache policy for the App build service. BuildKit state is
# disposable cache; completed AppDeployment OCI archives live in Stealth
# artifact storage and do not depend on this volume.
[worker.oci]
  enabled = true
  rootless = true
  noProcessSandbox = false
  gc = true
  reservedSpace = "1GB"
  maxUsedSpace = "10GB"
  minFreeSpace = "5GB"
  max-parallelism = 2

[frontend."dockerfile.v0"]
  enabled = true
