# Pinned to the OpenTelemetry Collector Contrib release declared in
# compose.production.yaml. The receiver is reachable only on the private
# Compose network; no host port is published.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage:
    directory: /var/lib/otelcol/file_storage
    create_directory: true
    fsync: true

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      scrape_configs:
        - job_name: stealth-api
          scrape_interval: 15s
          metrics_path: /metrics
          http_headers:
            X-Metrics-Token:
              values: ["${env:METRICS_TOKEN}"]
          static_configs:
            - targets: [api:8080]
        - job_name: stealth-worker
          scrape_interval: 15s
          metrics_path: /metrics
          http_headers:
            X-Metrics-Token:
              values: ["${env:METRICS_TOKEN}"]
          static_configs:
            - targets: [worker:9091]

  postgresql:
    endpoint: postgres:5432
    transport: tcp
    username: ${env:POSTGRES_USER}
    password: ${env:POSTGRES_PASSWORD}
    databases: ["${env:POSTGRES_DB}"]
    collection_interval: 15s
    tls:
      insecure: true

  redis:
    endpoint: redis:6379
    password: ${env:REDIS_PASSWORD}
    collection_interval: 15s

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96
  # This is the persistence boundary. Redact attributes, resource/scope
  # attributes, span events, and log bodies before any signal reaches
  # ClickHouse. API-side redaction remains defense in depth for legacy rows.
  redaction/telemetry:
    allow_all_keys: true
    redact_all_types: true
    blocked_key_patterns:
      - '(?i)(^|[._-])(password|passwd|pwd|secret|token|api[_-]?key|apikey|authorization|cookie|set-cookie|private[_-]?key|client[_-]?secret|access[_-]?token|refresh[_-]?token)([._-]|$)'
    blocked_values:
      - '(?i)(?:bearer|basic)[[:space:]]+[A-Za-z0-9._~+/-]+=*'
      - '(?i)(?:password|passwd|pwd|secret|token|api[_-]?key|apikey|authorization|cookie|set-cookie|private[_-]?key|client[_-]?secret|access[_-]?token|refresh[_-]?token)[''\"]?[[:space:]]*[:=][[:space:]]*(?:bearer|basic)[[:space:]]+[^[:space:],;]+'
      - '(?i)(?:password|passwd|pwd|secret|token|api[_-]?key|apikey|authorization|cookie|set-cookie|private[_-]?key|client[_-]?secret|access[_-]?token|refresh[_-]?token)[''\"]?[[:space:]]*[:=][[:space:]]*[^[:space:],;]+'
      - '(?i)[a-z][a-z0-9+.-]*://[^:/[:space:]]+:[^@/[:space:]]+@'
    summary: silent
  # The redaction processor covers structured fields and log bodies. These
  # scalar trace/metric fields are also persisted by the ClickHouse exporter
  # and need the same common-form secret scrub.
  transform/telemetry:
    error_mode: silent
    log_statements:
      - context: log
        statements:
          - set(log.attributes["stealth.log.event_id"], UUIDv7())
    trace_statements:
      - context: span
        statements:
          - replace_pattern(span.name, "(?i)(?:password|passwd|pwd|secret|token|api[_-]?key|apikey|authorization|cookie|set-cookie|private[_-]?key|client[_-]?secret|access[_-]?token|refresh[_-]?token)[[:space:]]*[:=][[:space:]]*(?:bearer|basic)[[:space:]]+[^[:space:],;]+", "[REDACTED]")
          - replace_pattern(span.name, "(?i)(?:password|passwd|pwd|secret|token|api[_-]?key|apikey|authorization|cookie|set-cookie|private[_-]?key|client[_-]?secret|access[_-]?token|refresh[_-]?token)[[:space:]]*[:=][[:space:]]*[^[:space:],;]+", "[REDACTED]")
          - replace_pattern(span.name, "(?i)[a-z][a-z0-9+.-]*://[^:/[:space:]]+:[^@/[:space:]]+@", "[REDACTED]")
          - replace_pattern(span.status.message, "(?i)(?:password|passwd|pwd|secret|token|api[_-]?key|apikey|authorization|cookie|set-cookie|private[_-]?key|client[_-]?secret|access[_-]?token|refresh[_-]?token)[[:space:]]*[:=][[:space:]]*(?:bearer|basic)[[:space:]]+[^[:space:],;]+", "[REDACTED]")
          - replace_pattern(span.status.message, "(?i)(?:password|passwd|pwd|secret|token|api[_-]?key|apikey|authorization|cookie|set-cookie|private[_-]?key|client[_-]?secret|access[_-]?token|refresh[_-]?token)[[:space:]]*[:=][[:space:]]*[^[:space:],;]+", "[REDACTED]")
          - replace_pattern(span.status.message, "(?i)[a-z][a-z0-9+.-]*://[^:/[:space:]]+:[^@/[:space:]]+@", "[REDACTED]")
      - context: spanevent
        statements:
          - replace_pattern(spanevent.name, "(?i)(?:password|passwd|pwd|secret|token|api[_-]?key|apikey|authorization|cookie|set-cookie|private[_-]?key|client[_-]?secret|access[_-]?token|refresh[_-]?token)[[:space:]]*[:=][[:space:]]*(?:bearer|basic)[[:space:]]+[^[:space:],;]+", "[REDACTED]")
          - replace_pattern(spanevent.name, "(?i)(?:password|passwd|pwd|secret|token|api[_-]?key|apikey|authorization|cookie|set-cookie|private[_-]?key|client[_-]?secret|access[_-]?token|refresh[_-]?token)[[:space:]]*[:=][[:space:]]*[^[:space:],;]+", "[REDACTED]")
          - replace_pattern(spanevent.name, "(?i)[a-z][a-z0-9+.-]*://[^:/[:space:]]+:[^@/[:space:]]+@", "[REDACTED]")
    metric_statements:
      - context: metric
        statements:
          - replace_pattern(metric.name, "(?i)(?:password|passwd|pwd|secret|token|api[_-]?key|apikey|authorization|cookie|set-cookie|private[_-]?key|client[_-]?secret|access[_-]?token|refresh[_-]?token)[[:space:]]*[:=][[:space:]]*(?:bearer|basic)[[:space:]]+[^[:space:],;]+", "[REDACTED]")
          - replace_pattern(metric.name, "(?i)(?:password|passwd|pwd|secret|token|api[_-]?key|apikey|authorization|cookie|set-cookie|private[_-]?key|client[_-]?secret|access[_-]?token|refresh[_-]?token)[[:space:]]*[:=][[:space:]]*[^[:space:],;]+", "[REDACTED]")
          - replace_pattern(metric.name, "(?i)[a-z][a-z0-9+.-]*://[^:/[:space:]]+:[^@/[:space:]]+@", "[REDACTED]")
          - replace_pattern(metric.description, "(?i)(?:password|passwd|pwd|secret|token|api[_-]?key|apikey|authorization|cookie|set-cookie|private[_-]?key|client[_-]?secret|access[_-]?token|refresh[_-]?token)[[:space:]]*[:=][[:space:]]*(?:bearer|basic)[[:space:]]+[^[:space:],;]+", "[REDACTED]")
          - replace_pattern(metric.description, "(?i)(?:password|passwd|pwd|secret|token|api[_-]?key|apikey|authorization|cookie|set-cookie|private[_-]?key|client[_-]?secret|access[_-]?token|refresh[_-]?token)[[:space:]]*[:=][[:space:]]*[^[:space:],;]+", "[REDACTED]")
          - replace_pattern(metric.description, "(?i)[a-z][a-z0-9+.-]*://[^:/[:space:]]+:[^@/[:space:]]+@", "[REDACTED]")
  resource:
    attributes:
      - key: deployment.environment
        value: self-hosted
        action: upsert
      - key: service.name
        value: stealth-host
        action: insert
  batch:
    timeout: 1s
    send_batch_size: 512
    send_batch_max_size: 1024

exporters:
  clickhouse:
    endpoint: tcp://${env:CLICKHOUSE_ADDR}?dial_timeout=10s
    database: ${env:CLICKHOUSE_DATABASE}
    username: ${env:CLICKHOUSE_USER}
    password: ${env:CLICKHOUSE_PASSWORD}
    create_schema: true
    async_insert: true
    compress: lz4
    ttl: ${env:TELEMETRY_RETENTION}
    timeout: 10s
    logs_table_name: otel_logs
    traces_table_name: otel_traces
    metrics_tables:
      gauge:
        name: otel_metrics_gauge
      sum:
        name: otel_metrics_sum
      summary:
        name: otel_metrics_summary
      histogram:
        name: otel_metrics_histogram
      exponential_histogram:
        name: otel_metrics_exp_histogram
    sending_queue:
      enabled: true
      storage: file_storage
      queue_size: 1000
      block_on_overflow: true
      num_consumers: 2
      batch:
        min_size: 512
        flush_timeout: 2s
    retry_on_failure:
      enabled: true
      initial_interval: 2s
      max_interval: 30s
      max_elapsed_time: 0s

service:
  # Keep Collector self-telemetry on the private Compose network so the smoke
  # test can distinguish receive/export failures from ClickHouse query errors.
  # compose.production.yaml does not publish this port to the host.
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  extensions: [health_check, file_storage]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, redaction/telemetry, transform/telemetry, resource, batch]
      exporters: [clickhouse]
    metrics:
      receivers: [otlp, prometheus, postgresql, redis]
      processors: [memory_limiter, redaction/telemetry, transform/telemetry, resource, batch]
      exporters: [clickhouse]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, redaction/telemetry, transform/telemetry, resource, batch]
      exporters: [clickhouse]
