name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable or numbered RC tag to publish from (for a controlled rerun)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    outputs:
      image_namespace: ${{ steps.metadata.outputs.image_namespace }}
      version: ${{ steps.metadata.outputs.version }}
      commit_sha: ${{ steps.metadata.outputs.commit_sha }}
      short_sha: ${{ steps.metadata.outputs.short_sha }}
      build_time: ${{ steps.metadata.outputs.build_time }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Resolve deterministic release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Release tags must match vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N" >&2
            exit 1
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version="$RELEASE_REF"
          commit_sha="$(git rev-parse HEAD)"
          short_sha="${commit_sha:0:12}"
          build_time="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          {
            echo "image_namespace=ghcr.io/$owner"
            echo "version=$version"
            echo "commit_sha=$commit_sha"
            echo "short_sha=$short_sha"
            echo "build_time=$build_time"
          } >> "$GITHUB_OUTPUT"

  validate:
    name: Validate release source
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.version }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache-dependency-path: go.sum

      - name: Go formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Go vet
        run: go vet ./...

      - name: Go tests
        run: go test ./... -count=1

      - name: Validate production Compose file
        run: docker compose --env-file .env.production.example -f compose.production.yaml config --quiet

      - name: Validate setup Compose file
        env:
          STEALTH_ENV_FILE: .env.production.example
          STEALTH_INSTALL_ROOT: /tmp/stealth-install
          STEALTH_SETUP_STATE_FILE: /tmp/stealth-install/state/setup-state.enc
          STEALTH_PRODUCTION_COMPOSE_FILE: /tmp/stealth-install/compose.production.yaml
          STEALTH_SETUP_COMPOSE_FILE: /tmp/stealth-install/compose.setup.yaml
        run: docker compose --env-file .env.production.example -f compose.setup.yaml config --quiet

      - name: Setup security regression
        run: ./scripts/setup-security-test.sh

      - name: Validate smoke scripts
        run: bash -n scripts/production-smoke.sh scripts/compose-production-smoke.sh scripts/bootstrap.sh scripts/bootstrap_test.sh scripts/setup-security-test.sh scripts/traefik-security-test.sh scripts/release_workflow_test.sh

      - name: Verify release bootstrap is revision-pinned
        run: ./scripts/release_workflow_test.sh

      - name: Test bootstrap failure handling
        run: ./scripts/bootstrap_test.sh

      - name: Telemetry security regression
        run: ./scripts/telemetry-security-test.sh

      - name: Traefik security regression
        run: ./scripts/traefik-security-test.sh

      - name: Collector Docker log parser smoke
        run: ./scripts/collector-log-parser-smoke.sh

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            console/package-lock.json
            console/tools/openapi-codegen/package-lock.json
            console/tools/eslint/package-lock.json

      - name: Install console dependencies
        working-directory: console
        run: npm ci

      - name: Console format
        working-directory: console
        run: npm run format:check

      - name: Generate OpenAPI client
        working-directory: console
        run: npm run api:generate

      - name: Verify generated client
        run: git diff --exit-code -- console/src/api/generated

      - name: Console typecheck
        working-directory: console
        run: npm run typecheck

      - name: Console lint
        working-directory: console
        run: npm run lint

      - name: Console unit tests
        working-directory: console
        run: npm run test

      - name: Console production build
        working-directory: console
        run: npm run build

  production-smoke:
    name: Build local images and run production smoke
    needs: [metadata, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      COMMIT_SHA: ${{ needs.metadata.outputs.commit_sha }}
      SHORT_SHA: ${{ needs.metadata.outputs.short_sha }}
      BUILD_TIME: ${{ needs.metadata.outputs.build_time }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.version }}

      - name: Build local API, setup, worker, migration, and Console images
        shell: bash
        run: |
          set -euo pipefail
          docker build --target api \
            --build-arg VERSION="$VERSION" \
            --build-arg COMMIT_SHA="$COMMIT_SHA" \
            --build-arg BUILD_TIME="$BUILD_TIME" \
            -t "stealth-api:smoke-$SHORT_SHA" .
          docker build --target setup \
            --build-arg VERSION="$VERSION" \
            --build-arg COMMIT_SHA="$COMMIT_SHA" \
            --build-arg BUILD_TIME="$BUILD_TIME" \
            -t "stealth-setup:smoke-$SHORT_SHA" .
          docker build --target worker \
            --build-arg VERSION="$VERSION" \
            --build-arg COMMIT_SHA="$COMMIT_SHA" \
            --build-arg BUILD_TIME="$BUILD_TIME" \
            -t "stealth-worker:smoke-$SHORT_SHA" .
          docker build --target migrate \
            --build-arg VERSION="$VERSION" \
            --build-arg COMMIT_SHA="$COMMIT_SHA" \
            --build-arg BUILD_TIME="$BUILD_TIME" \
            -t "stealth-migrate:smoke-$SHORT_SHA" .
          docker build --target telemetry-collector \
            --build-arg VERSION="$VERSION" \
            --build-arg COMMIT_SHA="$COMMIT_SHA" \
            --build-arg BUILD_TIME="$BUILD_TIME" \
            -t "stealth-otel-collector:smoke-$SHORT_SHA" .
          docker build --target telemetry-docker-logs \
            --build-arg VERSION="$VERSION" \
            --build-arg COMMIT_SHA="$COMMIT_SHA" \
            --build-arg BUILD_TIME="$BUILD_TIME" \
            -t "stealth-otel-docker-logs:smoke-$SHORT_SHA" .
          docker build --target telemetry-docker-proxy \
            --build-arg VERSION="$VERSION" \
            --build-arg COMMIT_SHA="$COMMIT_SHA" \
            --build-arg BUILD_TIME="$BUILD_TIME" \
            -t "stealth-telemetry-docker-proxy:smoke-$SHORT_SHA" .
          docker build -f console/Dockerfile \
            --build-arg NEXT_PUBLIC_API_BASE_URL= \
            --build-arg VERSION="$VERSION" \
            --build-arg COMMIT_SHA="$COMMIT_SHA" \
            --build-arg BUILD_TIME="$BUILD_TIME" \
            -t "stealth-console:smoke-$SHORT_SHA" .

      - name: Verify local setup image has no Docker tooling
        env:
          STEALTH_SETUP_IMAGE_FOR_TEST: stealth-setup:smoke-${{ env.SHORT_SHA }}
        run: ./scripts/setup-security-test.sh

      - name: Generate ephemeral smoke configuration
        env:
          SMOKE_ENV: ${{ runner.temp }}/stealth-production-smoke.env
        shell: bash
        run: |
          set -euo pipefail
          postgres_password="$(openssl rand -hex 24)"
          redis_password="$(openssl rand -hex 24)"
          clickhouse_password="$(openssl rand -hex 24)"
          functions_secret_key="$(openssl rand -base64 32 | tr -d '\n')"
          bootstrap_cli_key="$(openssl rand -base64 32 | tr -d '\n')"
          metrics_token="$(openssl rand -hex 32)"
          docker_gid="$(stat -c '%g' /var/run/docker.sock)"
          cat > "$SMOKE_ENV" <<EOF
          COMPOSE_PROJECT_NAME=stealth-release-smoke-${GITHUB_RUN_ID}
          STEALTH_API_IMAGE=stealth-api:smoke-${SHORT_SHA}
          STEALTH_WORKER_IMAGE=stealth-worker:smoke-${SHORT_SHA}
          STEALTH_MIGRATE_IMAGE=stealth-migrate:smoke-${SHORT_SHA}
          STEALTH_CONSOLE_IMAGE=stealth-console:smoke-${SHORT_SHA}
          OTEL_COLLECTOR_IMAGE=stealth-otel-collector:smoke-${SHORT_SHA}
          OTEL_HOST_COLLECTOR_IMAGE=stealth-otel-collector:smoke-${SHORT_SHA}
          OTEL_DOCKER_COLLECTOR_IMAGE=stealth-otel-collector:smoke-${SHORT_SHA}
          OTEL_DOCKER_LOGS_COLLECTOR_IMAGE=stealth-otel-docker-logs:smoke-${SHORT_SHA}
          STEALTH_TELEMETRY_DOCKER_PROXY_IMAGE=stealth-telemetry-docker-proxy:smoke-${SHORT_SHA}
          TRAEFIK_IMAGE=traefik:v3.7.13@sha256:1c32e7c368204fd72812152ebdd2ac0425993df6fd982317deb02e48f2d5423c
          POSTGRES_DB=stealth
          POSTGRES_USER=stealth
          POSTGRES_PASSWORD=${postgres_password}
          REDIS_PASSWORD=${redis_password}
          CLICKHOUSE_DATABASE=stealth_telemetry
          CLICKHOUSE_USER=stealth
          CLICKHOUSE_PASSWORD=${clickhouse_password}
          FUNCTIONS_SECRET_KEY=${functions_secret_key}
          BOOTSTRAP_CLI_KEY=${bootstrap_cli_key}
          GITHUB_APP_CLIENT_ID=smoke-client-id
          PUBLIC_APP_URL=http://127.0.0.1:13000
          COOKIE_SECURE=false
          TRUSTED_PROXY_CIDRS=172.30.0.0/24,172.31.0.254/32
          STEALTH_NETWORK_SUBNET=172.30.0.0/24
          STEALTH_NETWORK_NAME=stealth_release_smoke_network_${GITHUB_RUN_ID}
          STEALTH_INGRESS_NETWORK_NAME=stealth_release_smoke_ingress_${GITHUB_RUN_ID}
          STEALTH_INGRESS_NETWORK_SUBNET=172.31.0.0/24
          STEALTH_INGRESS_IP_RANGE=172.31.0.64/26
          STEALTH_TRAEFIK_INGRESS_IP=172.31.0.254
          STEALTH_CLOUDFLARED_INGRESS_IP=172.31.0.10
          STEALTH_TELEMETRY_STORE_NETWORK_NAME=stealth_release_smoke_telemetry_store_${GITHUB_RUN_ID}
          STEALTH_TELEMETRY_INGEST_NETWORK_NAME=stealth_release_smoke_telemetry_ingest_${GITHUB_RUN_ID}
          STEALTH_TELEMETRY_DOCKER_NETWORK_NAME=stealth_release_smoke_telemetry_docker_${GITHUB_RUN_ID}
          DOCKER_GID=${docker_gid}
          METRICS_TOKEN=${metrics_token}
          FUNCTIONS_RUNNER_ENABLED=true
          FUNCTIONS_RUNNER_STAGING_VOLUME=stealth_release_smoke_staging_${GITHUB_RUN_ID}
          POSTGRES_VOLUME_NAME=stealth_release_smoke_postgres_${GITHUB_RUN_ID}
          STORAGE_VOLUME_NAME=stealth_release_smoke_storage_${GITHUB_RUN_ID}
          CLICKHOUSE_VOLUME_NAME=stealth_release_smoke_clickhouse_${GITHUB_RUN_ID}
          OTELCOL_VOLUME_NAME=stealth_release_smoke_otelcol_${GITHUB_RUN_ID}
          OTEL_DOCKER_LOGS_VOLUME_NAME=stealth_release_smoke_otel_docker_logs_${GITHUB_RUN_ID}
          PROXY_HTTP_BIND=127.0.0.1
          PROXY_HTTP_PORT=8080
          API_HOST_PORT=18080
          CONSOLE_HOST_PORT=13000
          EOF
          chmod 600 "$SMOKE_ENV"

      - name: Validate rendered smoke Compose
        env:
          SMOKE_ENV: ${{ runner.temp }}/stealth-production-smoke.env
        run: docker compose --env-file "$SMOKE_ENV" -f compose.production.yaml config --quiet

      - name: Run production Compose HTTP smoke
        env:
          ENV_FILE: ${{ runner.temp }}/stealth-production-smoke.env
          SMOKE_REMOVE_VOLUMES: "true"
        run: ./scripts/compose-production-smoke.sh

  cli-artifacts:
    name: Build CLI release artifacts
    needs: [metadata, validate, production-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      COMMIT_SHA: ${{ needs.metadata.outputs.commit_sha }}
      BUILD_TIME: ${{ needs.metadata.outputs.build_time }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.version }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache-dependency-path: go.sum

      - name: Build Linux CLI archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/amd64 dist/arm64
          ldflags="-s -w -X github.com/Stealth-deplover/stealth/internal/buildinfo.Version=${VERSION} -X github.com/Stealth-deplover/stealth/internal/buildinfo.Commit=${COMMIT_SHA} -X github.com/Stealth-deplover/stealth/internal/buildinfo.BuildTime=${BUILD_TIME}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="$ldflags" -o dist/amd64/stealth ./cmd/stealth
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="$ldflags" -o dist/arm64/stealth ./cmd/stealth
          tar -czf dist/stealth_Linux_x86_64.tar.gz -C dist/amd64 stealth
          tar -czf dist/stealth_Linux_arm64.tar.gz -C dist/arm64 stealth
          (cd dist && sha256sum stealth_Linux_x86_64.tar.gz stealth_Linux_arm64.tar.gz > checksums.txt)
          rm -rf dist/amd64 dist/arm64

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v7
        with:
          name: stealth-cli-${{ needs.metadata.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  images:
    name: Build and publish release images
    needs: [metadata, validate, production-smoke, cli-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAMESPACE: ${{ needs.metadata.outputs.image_namespace }}
      VERSION: ${{ needs.metadata.outputs.version }}
      COMMIT_SHA: ${{ needs.metadata.outputs.commit_sha }}
      SHORT_SHA: ${{ needs.metadata.outputs.short_sha }}
      BUILD_TIME: ${{ needs.metadata.outputs.build_time }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: api
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT_SHA=${{ env.COMMIT_SHA }}
            BUILD_TIME=${{ env.BUILD_TIME }}
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/stealth-api:${{ env.VERSION }}
            ${{ env.IMAGE_NAMESPACE }}/stealth-api:sha-${{ env.SHORT_SHA }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ env.COMMIT_SHA }}
            org.opencontainers.image.created=${{ env.BUILD_TIME }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: worker
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT_SHA=${{ env.COMMIT_SHA }}
            BUILD_TIME=${{ env.BUILD_TIME }}
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/stealth-worker:${{ env.VERSION }}
            ${{ env.IMAGE_NAMESPACE }}/stealth-worker:sha-${{ env.SHORT_SHA }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ env.COMMIT_SHA }}
            org.opencontainers.image.created=${{ env.BUILD_TIME }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push setup image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: setup
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT_SHA=${{ env.COMMIT_SHA }}
            BUILD_TIME=${{ env.BUILD_TIME }}
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/stealth-setup:${{ env.VERSION }}
            ${{ env.IMAGE_NAMESPACE }}/stealth-setup:sha-${{ env.SHORT_SHA }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ env.COMMIT_SHA }}
            org.opencontainers.image.created=${{ env.BUILD_TIME }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push migration image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: migrate
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT_SHA=${{ env.COMMIT_SHA }}
            BUILD_TIME=${{ env.BUILD_TIME }}
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/stealth-migrate:${{ env.VERSION }}
            ${{ env.IMAGE_NAMESPACE }}/stealth-migrate:sha-${{ env.SHORT_SHA }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ env.COMMIT_SHA }}
            org.opencontainers.image.created=${{ env.BUILD_TIME }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push telemetry Docker proxy image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: telemetry-docker-proxy
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT_SHA=${{ env.COMMIT_SHA }}
            BUILD_TIME=${{ env.BUILD_TIME }}
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/stealth-telemetry-docker-proxy:${{ env.VERSION }}
            ${{ env.IMAGE_NAMESPACE }}/stealth-telemetry-docker-proxy:sha-${{ env.SHORT_SHA }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ env.COMMIT_SHA }}
            org.opencontainers.image.created=${{ env.BUILD_TIME }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push Stealth Collector image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: telemetry-collector
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT_SHA=${{ env.COMMIT_SHA }}
            BUILD_TIME=${{ env.BUILD_TIME }}
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/stealth-otel-collector:${{ env.VERSION }}
            ${{ env.IMAGE_NAMESPACE }}/stealth-otel-collector:sha-${{ env.SHORT_SHA }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ env.COMMIT_SHA }}
            org.opencontainers.image.created=${{ env.BUILD_TIME }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push Stealth Docker log Collector image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: telemetry-docker-logs
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT_SHA=${{ env.COMMIT_SHA }}
            BUILD_TIME=${{ env.BUILD_TIME }}
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/stealth-otel-docker-logs:${{ env.VERSION }}
            ${{ env.IMAGE_NAMESPACE }}/stealth-otel-docker-logs:sha-${{ env.SHORT_SHA }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ env.COMMIT_SHA }}
            org.opencontainers.image.created=${{ env.BUILD_TIME }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push Console image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./console/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=
            VERSION=${{ env.VERSION }}
            COMMIT_SHA=${{ env.COMMIT_SHA }}
            BUILD_TIME=${{ env.BUILD_TIME }}
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/stealth-console:${{ env.VERSION }}
            ${{ env.IMAGE_NAMESPACE }}/stealth-console:sha-${{ env.SHORT_SHA }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ env.COMMIT_SHA }}
            org.opencontainers.image.created=${{ env.BUILD_TIME }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  github-release:
    name: Create GitHub Release
    needs: [metadata, images, cli-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.version }}

      - name: Download CLI artifacts
        uses: actions/download-artifact@v8
        with:
          name: stealth-cli-${{ needs.metadata.outputs.version }}
          path: dist

      - name: Create release notes and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHORT_SHA: ${{ needs.metadata.outputs.short_sha }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          notes_file="$RUNNER_TEMP/release-notes.md"
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            cat > "$notes_file" <<EOF
          # Stealth $RELEASE_VERSION

          This is a release candidate for testing and is not yet recommended as the stable production release.

          ## Browser-based setup

          - Bootstrap from the VPS terminal and continue installation in the browser.
          - Use a secure one-time setup session with structured, resumable installation progress.
          - Start with a temporary Cloudflare Quick Tunnel and hand off to verified production ingress.

          ## GitHub onboarding

          - Create the GitHub App through the Manifest flow.
          - Authenticate the first Instance Owner in the browser with state and PKCE protections.
          - The recommended path does not require a manually supplied GitHub App Client ID.

          ## Cloudflare integration

          - Connect with a scoped Cloudflare API Token.
          - Discover the account and accessible zone, then provision the Named Tunnel and DNS automatically.
          - Verify the production hostname before shutting down the temporary Quick Tunnel.

          ## Installer architecture

          - Reuse the installation engine for setup and repair.
          - Run improved preflight checks and preserve Cloudflare binding consistency during retries and reconfiguration attempts.
          - Publish coordinated API, setup, worker, migration, and standalone Console images plus verified Linux CLI archives.

          ## Known limitations

          - Cloudflare OAuth remains inactive; the supported setup path is the scoped API Token flow.
          - A fresh external VPS validation with real GitHub and Cloudflare accounts is still required before stable promotion.
          - Rolling mixed API/worker/schema versions are not guaranteed compatible; external provider side effects remain at-least-once.

          This release is marked as a pre-release. It must not be treated as the stable/latest production release.
          EOF
          else
            cat > "$notes_file" <<EOF
          ## Highlights

          - Published coordinated API, setup, worker, migration, and standalone Console images for $RELEASE_VERSION.
          - Image tags: \`$RELEASE_VERSION\` and \`sha-$SHORT_SHA\`.
          - Attached verified Linux amd64 and arm64 Stealth CLI archives.

          ## Breaking changes

          - Review the configuration and migration notes before upgrading.

          ## Database migrations

          - Run the versioned \`stealth-migrate\` image before starting API and worker processes.

          ## Configuration changes

          - Compare \`.env.production.example\` with the deployment environment.

          ## Upgrade notes

          - Follow \`docs/upgrade.md\` and verify health, readiness, version metadata, and HTTP smoke checks.
          - The CLI installer keeps its configuration and persistent volumes when a deployment step fails.

          ## Known limitations

          - Rolling mixed API/worker/schema versions are not guaranteed compatible; external provider side effects remain at-least-once.
          EOF
          fi
          release_flags=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          release_assets=(
            dist/stealth_Linux_x86_64.tar.gz
            dist/stealth_Linux_arm64.tar.gz
            dist/checksums.txt
          )
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_VERSION already exists; refreshing its generated assets."
            gh release upload "$RELEASE_VERSION" --clobber "${release_assets[@]}"
          else
            gh release create "$RELEASE_VERSION" "${release_flags[@]}" \
              --title "Stealth $RELEASE_VERSION" \
              --notes-file "$notes_file" \
              "${release_assets[@]}"
          fi

  installer-smoke:
    name: Release installer smoke
    needs: [github-release, metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.version }}

      - name: Download bootstrap entrypoint
        shell: bash
        run: |
          set -euo pipefail
          bootstrap_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${RELEASE_VERSION}/scripts/bootstrap.sh"
          if [[ "$bootstrap_url" == *"/HEAD/"* ]]; then
            echo "release smoke tests must use the release revision for bootstrap.sh" >&2
            exit 1
          fi
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "$bootstrap_url" \
            -o "$RUNNER_TEMP/bootstrap.sh"
          chmod 0755 "$RUNNER_TEMP/bootstrap.sh"

      - name: Bootstrap and verify published CLI
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/stealth-bin"
          mkdir -p "$install_dir"
          status=0
          STEALTH_BIN_DIR="$install_dir" STEALTH_VERSION="$RELEASE_VERSION" \
            sh "$RUNNER_TEMP/bootstrap.sh" >"$RUNNER_TEMP/bootstrap.log" 2>&1 || status=$?
          if [ "$status" -ne 0 ]; then
            if grep -Eq '([Ii]nteractive setup requires a TTY|temporary onboarding tunnel did not publish a TryCloudflare URL in time)' "$RUNNER_TEMP/bootstrap.log"; then
              echo "The hosted runner could not complete the external Quick Tunnel handoff; continuing with the pinned CLI artifact checks."
            else
              cat "$RUNNER_TEMP/bootstrap.log"
              exit "$status"
            fi
          fi
          test -x "$install_dir/stealth"
          version_json="$($install_dir/stealth version --json)"
          printf '%s\n' "$version_json"
          printf '%s\n' "$version_json" | grep -Fq "\"version\":\"$RELEASE_VERSION\""

      - name: Validate release Compose configuration
        run: docker compose --env-file .env.production.example -f compose.production.yaml config --quiet
