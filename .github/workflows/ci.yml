name: CI

on:
  # Run on every branch so the workflow remains valid when the default branch
  # changes to main (or another protected branch).
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: stealth
          POSTGRES_USER: stealth
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stealth -d stealth"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:26.8.6.5
        env:
          CLICKHOUSE_DB: stealth_telemetry
          CLICKHOUSE_USER: stealth
          CLICKHOUSE_PASSWORD: ci-clickhouse-password
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 9000:9000
        options: >-
          --health-cmd "clickhouse-client --user stealth --password ci-clickhouse-password --query 'SELECT 1' | grep -q 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 20s
    env:
      # This is a non-secret validation value: 32 bytes of `a`, Base64 encoded.
      FUNCTIONS_SECRET_KEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache-dependency-path: go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./... -count=1

      - name: Admin alert PostgreSQL integration
        env:
          TEST_DATABASE_URL: postgres://stealth:ci-postgres-password@127.0.0.1:5432/stealth?sslmode=disable
        run: |
          set -Eeuo pipefail
          run_and_require_tests() {
            local package="$1"
            local pattern="$2"
            shift 2
            local log_file="$RUNNER_TEMP/admin-alert-${package//\//-}.log"
            go test "$package" -run "$pattern" -count=1 -v 2>&1 | tee "$log_file"
            for test_name in "$@"; do
              if ! grep -Fq -- "--- PASS: ${test_name}" "$log_file" || grep -Fq -- "--- SKIP: ${test_name}" "$log_file"; then
                echo "required integration test did not pass: ${test_name}" >&2
                return 1
              fi
            done
          }
          run_and_require_tests ./internal/repository \
            '^(TestDeleteAlertRuleAfterNotificationDeliveryIntegration|TestDeleteAlertRuleAfterResolveRetainsAllHistoryIntegration|TestDeleteAlertRuleNeverFiredIntegration|TestDeleteAlertRuleRetainsCompletedAndRetryableDeliveriesIntegration|TestDeleteAlertRuleRetainsMultipleNotificationDeliveriesIntegration|TestEvaluateAndDeleteAdminAlertRuleRaceProducesValidHistoryIntegration|TestQueryAdminAlertEventsGlobalCursorPaginationIntegration|TestQueryAdminAlertEventsPerRulePaginationSurvivesDeletionIntegration|TestQueryAdminAlertEventsTimeRangeIntegration|TestAdminAlertMonitorReferenceValidationIntegration|TestUpdateAdminMonitorPreservesAlertRuleCompatibilityIntegration|TestAdminMonitorAlertLockOrderingIntegration|TestAdminMonitorWorkerAndRuleUpdateConcurrencyIntegration|TestAdminMonitorWorkerAndRuleDeleteConcurrencyIntegration|TestAdminMonitorRuleCompatibilityConcurrentMutationIntegration|TestDeleteAdminMonitorWithAlertRuleConflictsIntegration|TestAdminRealtimeSequenceCommitOrderingIntegration|TestAdminRealtimeSequenceRollbackIntegration)$' \
            TestDeleteAlertRuleAfterNotificationDeliveryIntegration \
            TestDeleteAlertRuleAfterResolveRetainsAllHistoryIntegration \
            TestDeleteAlertRuleNeverFiredIntegration \
            TestDeleteAlertRuleRetainsCompletedAndRetryableDeliveriesIntegration \
            TestDeleteAlertRuleRetainsMultipleNotificationDeliveriesIntegration \
            TestEvaluateAndDeleteAdminAlertRuleRaceProducesValidHistoryIntegration \
            TestQueryAdminAlertEventsGlobalCursorPaginationIntegration \
            TestQueryAdminAlertEventsPerRulePaginationSurvivesDeletionIntegration \
            TestQueryAdminAlertEventsTimeRangeIntegration \
            TestAdminAlertMonitorReferenceValidationIntegration \
            TestUpdateAdminMonitorPreservesAlertRuleCompatibilityIntegration \
            TestAdminMonitorAlertLockOrderingIntegration \
            TestAdminMonitorWorkerAndRuleUpdateConcurrencyIntegration \
            TestAdminMonitorWorkerAndRuleDeleteConcurrencyIntegration \
            TestAdminMonitorRuleCompatibilityConcurrentMutationIntegration \
            TestDeleteAdminMonitorWithAlertRuleConflictsIntegration \
            TestAdminRealtimeSequenceCommitOrderingIntegration \
            TestAdminRealtimeSequenceRollbackIntegration
          run_and_require_tests ./internal/migrate \
            '^(TestAdminAlertHistoryMigrationBackfillsAndPreservesDeliveriesIntegration|TestAdminAlertHistoryGlobalIndexMigrationIntegration|TestAdminAlertKindContractMigrationRetiresUnsupportedKindsIntegration)$' \
            TestAdminAlertHistoryMigrationBackfillsAndPreservesDeliveriesIntegration \
            TestAdminAlertHistoryGlobalIndexMigrationIntegration \
            TestAdminAlertKindContractMigrationRetiresUnsupportedKindsIntegration
          run_and_require_tests ./internal/httpapi \
            '^(TestDeleteAdminAlertRulePreservesHistoryIntegration|TestAdminRealtimeSSEIntegration|TestAdminRealtimeSSEAuthorizationLifecycleIntegration)$' \
            TestDeleteAdminAlertRulePreservesHistoryIntegration \
            TestAdminRealtimeSSEIntegration \
            TestAdminRealtimeSSEAuthorizationLifecycleIntegration

      - name: Platform hostname and ingress PostgreSQL integration
        env:
          TEST_DATABASE_URL: postgres://stealth:ci-postgres-password@127.0.0.1:5432/stealth?sslmode=disable
        run: |
          set -Eeuo pipefail
          run_and_require_tests() {
            local package="$1"
            local pattern="$2"
            shift 2
            local log_file="$RUNNER_TEMP/platform-hostnames-${package//\//-}.log"
            go test "$package" -run "$pattern" -count=1 -v 2>&1 | tee "$log_file"
            for test_name in "$@"; do
              if ! grep -Fq -- "--- PASS: ${test_name}" "$log_file" || grep -Fq -- "--- SKIP: ${test_name}" "$log_file"; then
                echo "required platform hostname integration did not pass: ${test_name}" >&2
                return 1
              fi
            done
          }
          run_and_require_tests ./internal/migrate \
            '^TestPlatformSiteHostnameMigrationBackfillsStableGlobalLabelsIntegration$' \
            TestPlatformSiteHostnameMigrationBackfillsStableGlobalLabelsIntegration
          run_and_require_tests ./internal/repository \
            '^TestPlatformSiteAllocationAndRouteSnapshotIntegration$' \
            TestPlatformSiteAllocationAndRouteSnapshotIntegration
          run_and_require_tests ./internal/httpapi \
            '^(TestInstanceDomainSettingsIntegration|TestPlatformSiteAPIAndNarrowListenerIntegration)$' \
            TestInstanceDomainSettingsIntegration \
            TestPlatformSiteAPIAndNarrowListenerIntegration
          run_and_require_tests ./internal/migrate \
            '^TestCloudflareConnectionMigrationOnPopulatedNonCloudflareInstanceIntegration$' \
            TestCloudflareConnectionMigrationOnPopulatedNonCloudflareInstanceIntegration
          run_and_require_tests ./internal/repository \
            '^TestCloudflareConnectionPersistenceAndReconciliationIntegration$' \
            TestCloudflareConnectionPersistenceAndReconciliationIntegration
          run_and_require_tests ./internal/httpapi \
            '^TestAdminCloudflareConnectionOwnerBoundaryAndSecretProjectionIntegration$' \
            TestAdminCloudflareConnectionOwnerBoundaryAndSecretProjectionIntegration

      - name: Real Collector and telemetry integration suites
        env:
          TEST_DATABASE_URL: postgres://stealth:ci-postgres-password@127.0.0.1:5432/stealth?sslmode=disable
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
          TEST_CLICKHOUSE_ADDR: 127.0.0.1:9000
          TEST_CLICKHOUSE_DATABASE: stealth_telemetry
          TEST_CLICKHOUSE_USER: stealth
          TEST_CLICKHOUSE_PASSWORD: ci-clickhouse-password
          TEST_OTEL_COLLECTOR_HTTP: http://127.0.0.1:4318
        run: |
          set -Eeuo pipefail
          collector_state="$RUNNER_TEMP/stealth-otel-integration-state"
          mkdir -p "$collector_state"
          chmod 777 "$collector_state"
          docker run --detach --name stealth-otel-integration --network host \
            --env CLICKHOUSE_ADDR=127.0.0.1:9000 \
            --env CLICKHOUSE_DATABASE="$TEST_CLICKHOUSE_DATABASE" \
            --env CLICKHOUSE_USER="$TEST_CLICKHOUSE_USER" \
            --env CLICKHOUSE_PASSWORD="$TEST_CLICKHOUSE_PASSWORD" \
            --env METRICS_TOKEN=ci-metrics-token \
            --env POSTGRES_DB=stealth \
            --env POSTGRES_USER=stealth \
            --env POSTGRES_PASSWORD=ci-postgres-password \
            --env REDIS_PASSWORD=ci-redis-password \
            --env TELEMETRY_RETENTION=720h \
            --volume "$GITHUB_WORKSPACE/telemetry/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro" \
            --volume "$collector_state:/var/lib/otelcol" \
            otel/opentelemetry-collector-contrib:0.161.0 \
            --config=/etc/otelcol-contrib/config.yaml >/dev/null
          cleanup() {
            local status=$?
            if [ "$status" -ne 0 ]; then
              docker logs --tail=160 stealth-otel-integration >&2 || true
            fi
            docker rm --force stealth-otel-integration >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:13133/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:13133/ >/dev/null
          go test ./internal/httpapi -run Integration -count=1 -v
          go test ./internal/telemetry -run Integration -count=1 -v

      - name: Docker image build
        run: docker build --target api -t stealth-api .

      - name: Ingress control image build
        run: docker build --target ingress-control -t stealth-ingress-control:ci .

      - name: Stealth Collector image build
        run: docker build --target telemetry-collector -t stealth-otel-collector:ci .

      - name: Stealth Docker log Collector image build
        run: docker build --target telemetry-docker-logs -t stealth-otel-docker-logs:ci .

      - name: Docker metrics proxy image build
        run: docker build --target telemetry-docker-proxy -t stealth-telemetry-docker-proxy:ci .

      - name: Telemetry security regression
        run: ./scripts/telemetry-security-test.sh

      - name: Collector Docker log parser smoke
        run: ./scripts/collector-log-parser-smoke.sh

      - name: Setup security regression
        run: ./scripts/setup-security-test.sh

      - name: Traefik security regression
        run: ./scripts/traefik-security-test.sh

      - name: Build setup image without Docker tooling
        run: docker build --target setup -t stealth-setup:ci .

      - name: Verify setup image has no Docker binaries
        env:
          STEALTH_SETUP_IMAGE_FOR_TEST: stealth-setup:ci
        run: ./scripts/setup-security-test.sh

  installer:
    name: Installer and release checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache-dependency-path: go.sum

      - name: Validate bootstrap and release scripts
        run: |
          for script in scripts/bootstrap.sh scripts/bootstrap_test.sh scripts/release_workflow_test.sh scripts/managed-asset-upgrade-smoke.sh scripts/real-v025-upgrade-smoke.sh scripts/compose-production-smoke.sh scripts/public-hosting-acceptance.sh scripts/traefik-security-test.sh; do
            bash -n "$script"
          done

      - name: Test public acceptance redirect policy
        run: python3 -m unittest discover -s scripts -p 'test_public_hosting_redirect.py'

      - name: Verify release smoke revision pinning
        run: ./scripts/release_workflow_test.sh

      - name: Test bootstrap failure handling
        run: ./scripts/bootstrap_test.sh

      - name: Build CLI
        run: go build ./cmd/stealth

      - name: Build Linux amd64 CLI
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./cmd/stealth

      - name: Build Linux arm64 CLI
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./cmd/stealth

      - name: Validate production Compose file
        run: docker compose --env-file .env.production.example -f compose.production.yaml config --quiet

      - name: Traefik security regression
        run: ./scripts/traefik-security-test.sh

      - name: Docker uninstall purge integration
        env:
          TEST_DOCKER_INTEGRATION: "1"
        run: go test ./internal/cli -run '^TestPurgeCurrentManagedVolumesDockerIntegration$' -count=1 -v

  console:
    name: Console checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            console/package-lock.json
            console/tools/openapi-codegen/package-lock.json
            console/tools/eslint/package-lock.json

      - name: Install console dependencies
        working-directory: console
        run: npm ci

      - name: Generate OpenAPI client
        working-directory: console
        run: npm run api:generate

      - name: Verify generated client is committed
        run: git diff --exit-code -- console/src/api/generated

      - name: Typecheck
        working-directory: console
        run: npm run typecheck

      - name: Lint
        working-directory: console
        run: npm run lint

      - name: Unit tests
        working-directory: console
        run: npm run test

      - name: Production build
        working-directory: console
        run: npm run build

      - name: Install Playwright browser
        working-directory: console
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: console
        run: npm run test:e2e

      - name: Docker image build
        run: docker build -f console/Dockerfile -t stealth-console:test .
