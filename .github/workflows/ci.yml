name: CI

on:
  # Run on every branch so the workflow remains valid when the default branch
  # moves from the current import branch to main (or another protected branch).
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: stealth
          POSTGRES_USER: stealth
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stealth -d stealth"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # This is a non-secret validation value: 32 bytes of `a`, Base64 encoded.
      FUNCTIONS_SECRET_KEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache-dependency-path: go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./... -count=1

      - name: PostgreSQL and Redis integration suite
        env:
          TEST_DATABASE_URL: postgres://stealth:ci-postgres-password@127.0.0.1:5432/stealth?sslmode=disable
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: go test ./internal/httpapi -run Integration -count=1

      - name: Docker image build
        run: docker build --target api -t stealth-api .

  console:
    name: Console checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install console dependencies
        working-directory: console
        run: npm ci

      - name: Generate OpenAPI client
        working-directory: console
        run: npm run api:generate

      - name: Verify generated client is committed
        run: git diff --exit-code -- console/src/api/generated

      - name: Typecheck
        working-directory: console
        run: npm run typecheck

      - name: Lint
        working-directory: console
        run: npm run lint

      - name: Unit tests
        working-directory: console
        run: npm run test

      - name: Production build
        working-directory: console
        run: npm run build

      - name: Install Playwright browser
        working-directory: console
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: console
        run: npm run test:e2e

      - name: Docker image build
        run: docker build -f console/Dockerfile -t stealth-console:test .
