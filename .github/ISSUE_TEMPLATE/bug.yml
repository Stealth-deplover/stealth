name: Bug report
description: Report a reproducible problem in Stealth
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please remove secrets and private data before submitting.
  - type: input
    id: version
    attributes:
      label: Stealth version or commit
      description: Which release, tag, or commit is affected?
      placeholder: v0.1.0 or 96c4b26
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Go API
        - Worker or runner
        - Console
        - CLI or installer
        - Deployment or documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable reproduction.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and logs
      description: Include OS, architecture, deployment mode, and sanitized logs.
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I removed secrets and private customer data.
          required: true
        - label: I searched existing issues for duplicates.
          required: true
