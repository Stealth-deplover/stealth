# Place this server behind your TLS termination or add certificates here.
# The API path is same-origin so the Go session cookie works without a browser CORS hop.
# Nginx includes files in conf.d from the http context, so this map is valid here.
# It prevents HSTS from being sent during plain HTTP local development while still
# enabling it when the TLS terminator forwards X-Forwarded-Proto: https.
map $http_x_forwarded_proto $stealth_hsts {
    default "";
    https "max-age=31536000; includeSubDomains";
}

upstream stealth_console_web {
    server stealth-web:3000;
}

upstream stealth_api {
    server stealth-api:8080;
}

server {
    listen 80;
    server_name console.stealth.dev;
    client_max_body_size 100m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:;" always;
    add_header Strict-Transport-Security $stealth_hsts always;

    location /v1/ {
        proxy_pass http://stealth_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://stealth_console_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
