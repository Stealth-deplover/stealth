# Place this server behind your TLS termination or add certificates here.
# The API path is same-origin so the Go session cookie works without a browser CORS hop.
# Nginx includes files in conf.d from the http context, so these maps are valid here.
#
# This assumes the preceding load balancer/ingress is trusted and sanitizes
# X-Forwarded-Proto before forwarding traffic. Do not expose this listener to
# untrusted clients while accepting arbitrary forwarded headers.
map $http_x_forwarded_proto $stealth_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Use the normalized external protocol for HSTS as well. This keeps local HTTP
# development unpinned while preserving HTTPS when TLS terminates upstream.
map $stealth_forwarded_proto $stealth_hsts {
    default "";
    https "max-age=31536000; includeSubDomains";
}

upstream stealth_console_web {
    server stealth-web:3000;
}

upstream stealth_api {
    server stealth-api:8080;
}

server {
    listen 80;
    server_name console.stealth.dev;
    client_max_body_size 100m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self';" always;
    add_header Strict-Transport-Security $stealth_hsts always;

    # SSE must not wait in an intermediary buffer. Keep this scoped to the
    # project realtime endpoint; ordinary API responses retain normal proxy
    # behavior. The Go API still authorizes the project and session.
    location ~ "^/v1/projects/[0-9a-fA-F-]{36}/realtime$" {
        proxy_pass http://stealth_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $stealth_forwarded_proto;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /v1/ {
        proxy_pass http://stealth_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $stealth_forwarded_proto;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://stealth_console_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $stealth_forwarded_proto;
    }
}
